name: Deploy Pages (public allowlist only)

# The source repository (klarweg) is PRIVATE. The public website
# https://klarweg.in is served by GitHub Pages from a separate PUBLIC
# repository, reegangandhi16-pixel/klarweg-site, that holds nothing but the
# built artifact.
#
#   1. scripts/site-artifact.sh builds the artifact from
#      .github/pages-allowlist.txt and hard-fails on any private path or
#      private content (scripts/site-leak-check.mjs: paid chapter data, full
#      dictionary, full manifest, paid timing, any audio, gated markers).
#   2. scripts/site-publish.sh replaces klarweg-site's tree with that
#      artifact (+ .nojekyll, + CNAME only if vars.SITE_CNAME is set), re-runs the content check on exactly
#      what is pushed, and pushes with a deploy key that can write ONLY to
#      klarweg-site. klarweg-site's own Pages build publishes it.
#
# Manual fallback (e.g. Actions unavailable): run the same two scripts
# locally (see scripts/site-publish.sh).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public artifact (allowlist + leak checks)
        run: bash scripts/site-artifact.sh _site

      - name: Publish artifact to the public site repository
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          # Custom domain of the site repo. Repository variable, EMPTY until the
          # domain move: then no CNAME is published and klarweg.in stays where
          # it is. Setting vars.SITE_CNAME=klarweg.in is the explicit domain-move step.
          SITE_CNAME: ${{ vars.SITE_CNAME }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site_deploy
          chmod 600 ~/.ssh/site_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          bash scripts/site-publish.sh _site git@github.com:reegangandhi16-pixel/klarweg-site.git "$GITHUB_SHA"
          rm -f ~/.ssh/site_deploy
