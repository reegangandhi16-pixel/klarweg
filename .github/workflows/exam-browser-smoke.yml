name: Exam browser smoke (access Worker)

# Fast browser subset for changes to the klarweg-access Worker or package.json that are NOT exam
# code: six journeys through the real klarweg-access Worker in-process (session, MFA, admin
# grant/revoke, lease expiry, two-tab takeover, confidentiality, precheck), sequentially in one job.
# The full suite (exam-browser.yml) still runs for exam code, weekly on main and on demand.
# PR-only: the merged result is covered by npm-test on main and the weekly full run.
# The access Worker's unit and integration tests (chapters, entitlements, resources, progress,
# sessions, CORS, ...) run on every PR in the required npm-test check (site-tests.yml).

on:
  pull_request:
    paths:
      - 'package.json'
      - 'access/worker/src/**'
      - 'access/worker/test/**'
      - 'access/worker/wrangler.toml'
      - 'exam-worker/test/run-browser-scenarios.sh'
      - '.github/workflows/exam-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-browser-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: '24'
      - name: Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Browser smoke (via Access proxy)
        env:
          GROUP: smoke
          KX_DEV_PROXY: '1'
          KX_E2E_FORM: p1
          CHROME_ARGS: --no-sandbox
          KX_E2E_VERBOSE: '1'
        run: bash exam-worker/test/run-browser-scenarios.sh
