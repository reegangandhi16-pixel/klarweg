name: Exam toolchain tests

# Test-only workflow for the exam toolchain (content validator, release builder, exam Worker, exam shell).
# It deploys nothing, needs no secrets and is independent of "Deploy Pages (public allowlist only)".
# The exam tests use only Node built-ins (no npm install). ffmpeg from the distribution enables the opt-in
# real-encoder audio checks (KW_FFMPEG); its version is printed in the log (not pinned).
# Actions are pinned by commit SHA.

on:
  pull_request:
    paths:
      - 'package.json'
      - 'exam-content/**'
      - 'exam-worker/**'
      - 'exam/**'
      - 'access/worker/src/**'
      - 'access/worker/test/**'
      - 'access/worker/*.sql'
      - '.github/workflows/exam-tests.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'exam-content/**'
      - 'exam-worker/**'
      - 'exam/**'
      - 'access/worker/src/**'
      - 'access/worker/test/**'
      - 'access/worker/*.sql'
      - '.github/workflows/exam-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 25: a slow Ubuntu mirror has taken > 15 min to deliver ffmpeg and cancelled the job before any test ran
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install ffmpeg (real-encoder audio checks)
        # bounded APT retries and per-request HTTP/HTTPS timeouts: a stalled mirror connection is retried instead of
        # hanging until the job timeout
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y -q ffmpeg
          ffmpeg -hide_banner -version | head -1
      - name: Exam tests (boundary check, validator, unit and integration tests)
        env:
          KW_FFMPEG: /usr/bin/ffmpeg
        run: npm run -s test:exam
