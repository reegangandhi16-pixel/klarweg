name: Klarweg Social Agent
on:
  schedule:
    # 04:00, 08:00, 12:00, 16:00, 20:00 and 00:00 IST.
    - cron: '30 2,6,10,14,18,22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Safe dry-run (recommended)'
        required: true
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
concurrency:
  group: klarweg-social-agent
  cancel-in-progress: false
jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check agent
        run: node --test social-agent/scripts/*.test.mjs
      - name: Run scheduled jobs (gated)
        env:
          SOCIAL_PUBLISH_ENABLED: ${{ vars.SOCIAL_PUBLISH_ENABLED == 'true' && github.event.inputs.dry_run != 'true' && 'true' || 'false' }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node social-agent/scripts/agent.mjs
      - name: Persist posting ledger, if changed
        if: always()
        run: |
          if ! git diff --quiet -- social-agent/ledger.json; then
            git config user.name 'klarweg-social-agent[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add social-agent/ledger.json
            git commit -m 'chore(social): record publishing attempts and results'
            git push
          fi
