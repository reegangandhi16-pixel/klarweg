name: Site tests (npm test)

# The general suite: Access Worker, Tutor Worker + eval, scripts/*.test.mjs (incl. the live-classes static guards)
# and the generated-file checks. No dependencies to install, no secrets, deploys nothing. Actions pinned by SHA.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: '24'
      - name: npm test
        run: npm test
      - name: Generated files are committed (the suite regenerates the tutor registry)
        run: git diff --exit-code
