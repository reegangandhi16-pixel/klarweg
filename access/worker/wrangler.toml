name = "klarweg-access"

main = "src/index.js"

compatibility_date = "2024-11-06"

workers_dev = true

# DEPLOY WITH `npm run deploy:access` (repo root). It runs
# scripts/predeploy-access-check.mjs first, which refuses to deploy if
# these [vars] would silently change the live Cashfree environment.
#
# Cashfree: production is currently SANDBOX. To go live, change BOTH
# CASHFREE_ENV and CASHFREE_APP_ID here in one reviewed commit, set the
# live secret with `wrangler secret put CASHFREE_SECRET_KEY`, and deploy
# with --allow-cashfree-env-change=production. The Worker itself refuses
# checkout when the two values disagree (src/cashfree-config.js).
[vars]
CASHFREE_ENV = "sandbox"
CASHFREE_APP_ID = "TEST109236435b63e20d77f9296f28d234632901"
GOOGLE_CLIENT_ID = "584881453594-kdmjg0h79716s4tl65g0p1mlurshih3i.apps.googleusercontent.com"

# Klarweg AI (see src/ai.js). ON. Chapter AI: with the Chapter-1 preview at 0,
# only accounts holding a level entitlement qualify. Homepage chat: buyers, plus
# a few free questions a day for signed-out visitors (AI_ANON_* below).
# Deploy with `npm run deploy:access -- --allow-ai-enabled`.
# Kill switch: set "false" and redeploy (no flag needed), or wrangler rollback.
AI_ENABLED = "true"
# Controlled test: no Chapter-1 preview for non-buyers (0 = always 429).
AI_PREVIEW_DAILY_UNITS = "0"
AI_PREVIEW_MONTHLY_UNITS = "0"
# Controlled-test ceilings (were 3000 / $5.00). Failed provider calls count too.
AI_GLOBAL_DAILY_REQUESTS = "300"
# US$ micro-units per UTC day across all learners (1000000 = $1.00).
AI_GLOBAL_DAILY_BUDGET_MICROS = "1000000"
# Klarweg AI per account: ONE allowance shared by the homepage chat and all
# chapter AI of a level owner (any owned level for the homepage, that level
# for its chapters), inside the same global ceilings above.
AI_CHAT_DAILY_UNITS = "20"
AI_CHAT_MONTHLY_UNITS = "100"
# Homepage chat for signed-out visitors: free questions per browser/device
# per UTC day ("0" switches anonymous chat off); a secondary abuse cap for
# all devices on one network together; and all anonymous visitors together
# per UTC day, kept well inside AI_GLOBAL_DAILY_REQUESTS.
AI_ANON_DAILY_UNITS = "3"
AI_ANON_NETWORK_DAILY_REQUESTS = "30"
AI_ANON_GLOBAL_DAILY_REQUESTS = "100"

# Record & Check speech transcription (src/speech.js → klarweg-tutor
# /v1/transcribe → OpenAI gpt-transcribe; the key is the TUTOR's existing
# OPENAI_API_KEY secret). OFF by default.
#   "off"        nobody; chapter pages keep browser speech recognition
#   "allowlist"  only accounts listed in the SPEECH_ALLOWLIST secret
#                (comma-separated user ids) — internal staging
#   "entitled"   every signed-in owner of the chapter's level
# Kill switch: set "off" and redeploy, or wrangler rollback.
SPEECH_MODE = "off"
# Exact chapter ids only. A1·01 until real validation is complete.
SPEECH_CHAPTERS = "a1-1-alphabet"
# Per account: checks per minute (anti-hammering), per UTC day, per month.
SPEECH_PER_MINUTE = "6"
SPEECH_DAILY_CHECKS = "60"
SPEECH_MONTHLY_CHECKS = "600"
# All learners together per UTC day: requests, and estimated spend in US$
# micro-units (500000 = $0.50) at SPEECH_PRICE_MICROS_PER_MIN (gpt-transcribe
# list price $0.0045/min = 4500).
SPEECH_GLOBAL_DAILY_REQUESTS = "500"
SPEECH_GLOBAL_DAILY_BUDGET_MICROS = "500000"
SPEECH_PRICE_MICROS_PER_MIN = "4500"
# One recording: bytes (1 MiB ≈ 4 min of Opus — far above the cap below)
# and declared length in seconds (the page itself stops at 20 s).
SPEECH_MAX_BYTES = "1048576"
SPEECH_MAX_SECONDS = "30"

# Chapter resource PDFs (src/resources.js). The bucket is PRIVATE: no
# public r2.dev URL and no custom domain — objects are only ever streamed
# by this Worker after a signed-link check. RESOURCE_RELEASE selects the
# immutable release prefix ("r1/…"); switching releases is this one line.
# Secret (wrangler secret put): RESOURCE_URL_SECRET — HMAC key for links.
RESOURCE_RELEASE = "r2"

[[r2_buckets]]
binding = "RESOURCES"
bucket_name = "klarweg-resources"

[[d1_databases]]
binding = "DB"
database_name = "klarweg-access"
database_id = "208a8507-b0ec-48e0-812c-c4aa38c8dd32"

# Private tutor Worker (tutor/worker). Deploy klarweg-tutor FIRST —
# a service binding to a Worker that does not exist fails the deploy.
[[services]]
binding = "TUTOR"
service = "klarweg-tutor"

# Secrets (wrangler secret put <NAME>) — never in this file:
#   CASHFREE_SECRET_KEY
#   RATE_SALT
#   CASHFREE_WEBHOOK_SECRET   (optional; defaults to CASHFREE_SECRET_KEY)
#   RESOURCE_URL_SECRET       (signed chapter-resource links; 32+ random bytes)
#   SPEECH_ALLOWLIST          (only for SPEECH_MODE = "allowlist": comma-separated user ids)
