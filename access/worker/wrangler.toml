name = "klarweg-access"

main = "src/index.js"

compatibility_date = "2024-11-06"

workers_dev = true

# DEPLOY WITH `npm run deploy:access` (repo root). It runs
# scripts/predeploy-access-check.mjs first, which refuses to deploy if
# these [vars] would silently change the live Cashfree environment.
#
# Cashfree: PRODUCTION (live payments) since 2026-10-30. CASHFREE_ENV and
# CASHFREE_APP_ID change together, in one reviewed commit, with the matching
# CASHFREE_SECRET_KEY secret (never in this file). The Worker refuses
# checkout when they disagree (src/cashfree-config.js). Go-live, rollback and
# the sandbox keys' home: docs/CASHFREE-PRODUCTION.md.
[vars]
CASHFREE_ENV = "production"
CASHFREE_APP_ID = "115666718bafaa0ac9e7b68c1c37666511"
GOOGLE_CLIENT_ID = "584881453594-kdmjg0h79716s4tl65g0p1mlurshih3i.apps.googleusercontent.com"

# Public site origin (klarweg.in since 2026-10-30; docs/DOMAIN-MIGRATION-KLARWEG-IN.md).
# ACCOUNT_RETURN_URL: where the iOS Google redirect sign-in lands
# (src/auth-routes.js). SITE_BASE_URL: Cashfree return_url fallback when the
# request Origin is not a known site origin (src/cashfree-config.js). Both
# were set on the live Worker from the dashboard; keeping them here stops a
# `wrangler deploy` (no keep_vars) from silently removing them.
ACCOUNT_RETURN_URL = "https://klarweg.in/account/index.html"
SITE_BASE_URL = "https://klarweg.in"

# Coupon KLARWEGFREE1 (src/coupons.js): ₹4,998 off Klarweg Lifetime only
# (₹4,999 → ₹1). No expiry, no redemption limit (owner decision 2026-10-30).
# Kill switch: set "off" in the Cloudflare dashboard (takes effect without a
# code deploy); a later `wrangler deploy` re-applies this value.
COUPON_KLARWEGFREE1 = "on"

# Same-day ₹100 consultation booking (src/consultations.js). OFF.
#   "off"      no online booking; the Live Classes page keeps the email request
#   "sandbox"  Cashfree TEST payments only (needs CASHFREE_ENV = "sandbox")
#   "live"     real payments (needs CASHFREE_ENV = "production")
# Anything but "off" needs `npm run deploy:access -- --allow-consult-booking=<mode>`,
# and "live" also needs the owner decisions and launch checklist in
# docs/live-classes-consultation-booking.md. CONSULT_TEACHERS lists the
# bookable teacher ids: only "reegan-gandhi" and "candidate-01" are ever
# accepted, and each must be published on the Live Classes page. A teacher
# is bookable only on dates with a confirmed consult_availability row.
CONSULT_BOOKING = "off"
CONSULT_TEACHERS = ""

# Live-course enrolment with online payment (src/enrolments.js). OFF.
#   "off"      no online course payments (default)
#   "sandbox"  Cashfree TEST payments only (needs CASHFREE_ENV = "sandbox")
#   "live"     real payments (needs CASHFREE_ENV = "production")
# Deploying anything but "off" needs --allow-enrol-payments=<mode>; see
# docs/live-classes-online-payments.md. ENROL_COURSES lists the courses open
# for online enrolment with the batch being sold, e.g.
#   {"live-a1":{"batch":"2026-11-02"}}
# (each must be published with enrolment "open" on the Live Classes page).
# ENROL_CONSULT_CREDIT: "off" or "course-fee" (whether a confirmed ₹100
# consultation from the last 7 days reduces the course fee). Owner decision
# D11 (2026-10-21): "course-fee", as approved in D4. It changes nothing
# while ENROL_PAYMENTS is "off".
ENROL_PAYMENTS = "off"
ENROL_COURSES = ""
ENROL_CONSULT_CREDIT = "course-fee"

# Klarweg AI (see src/ai.js). ON. Chapter AI: with the Chapter-1 preview at 0,
# only accounts holding a level entitlement qualify. Homepage chat: buyers, plus
# a few free questions a day for signed-out visitors (AI_ANON_* below).
# Deploy with `npm run deploy:access -- --allow-ai-enabled`.
# Kill switch: set "false" and redeploy (no flag needed), or wrangler rollback.
AI_ENABLED = "true"
# Controlled test: no Chapter-1 preview for non-buyers (0 = always 429).
AI_PREVIEW_DAILY_UNITS = "0"
AI_PREVIEW_MONTHLY_UNITS = "0"
# Controlled-test ceilings (were 3000 / $5.00). Failed provider calls count too.
AI_GLOBAL_DAILY_REQUESTS = "300"
# US$ micro-units per UTC day across all learners (1000000 = $1.00).
AI_GLOBAL_DAILY_BUDGET_MICROS = "1000000"
# Klarweg AI per account: ONE allowance shared by the homepage chat and all
# chapter AI of a level owner (any owned level for the homepage, that level
# for its chapters), inside the same global ceilings above.
AI_CHAT_DAILY_UNITS = "20"
AI_CHAT_MONTHLY_UNITS = "100"
# Homepage chat for signed-out visitors: free questions per browser/device
# per UTC day ("0" switches anonymous chat off); a secondary abuse cap for
# all devices on one network together; and all anonymous visitors together
# per UTC day, kept well inside AI_GLOBAL_DAILY_REQUESTS.
AI_ANON_DAILY_UNITS = "3"
AI_ANON_NETWORK_DAILY_REQUESTS = "30"
AI_ANON_GLOBAL_DAILY_REQUESTS = "100"

# Record & Check speech transcription (src/speech.js → klarweg-tutor
# /v1/transcribe → OpenAI gpt-transcribe; the key is the TUTOR's existing
# OPENAI_API_KEY secret). Shipped OFF; "allowlist" (owner-only internal
# staging) from 2026-10-03; production: "entitled" on every chapter.
# Every chapter page asks /speech/status; only chapters inside the scope
# below can say yes (src/speech.js speechChapter).
#   "off"        nobody; chapter pages keep browser speech recognition
#   "allowlist"  only accounts listed in the SPEECH_ALLOWLIST secret
#                (comma-separated user ids) — internal staging
#   "entitled"   every signed-in owner of the chapter's level
# Kill switch: set "off" and redeploy, or wrangler rollback.
SPEECH_MODE = "entitled"
# Scope = levels ("a1", "a1,a2", … or "all"; empty = none) PLUS the explicit
# chapter list, MINUS the exclusions. Production: "all" — every chapter in
# src/speech-tasks.js (generated from the chapter data); access still comes
# from the learner's level entitlement. Widening needs
# `--allow-speech-scope=<SPEECH_SCOPE>` (or `=list`).
SPEECH_SCOPE = "all"
SPEECH_CHAPTERS = ""
SPEECH_CHAPTERS_EXCLUDE = ""
# Per account, per Speaking task (one Record & check button), per UTC day:
# AI checks and browser-recognition checks together. Never above 3.
SPEECH_TASK_DAILY_CHECKS = "3"
# Per account: checks per minute (anti-hammering), per UTC day, per month.
SPEECH_PER_MINUTE = "6"
SPEECH_DAILY_CHECKS = "60"
SPEECH_MONTHLY_CHECKS = "600"
# All learners together per UTC day: requests, and estimated spend in US$
# micro-units (500000 = $0.50) at SPEECH_PRICE_MICROS_PER_MIN (gpt-transcribe
# list price $0.0045/min = 4500).
SPEECH_GLOBAL_DAILY_REQUESTS = "500"
SPEECH_GLOBAL_DAILY_BUDGET_MICROS = "500000"
SPEECH_PRICE_MICROS_PER_MIN = "4500"
# One recording: bytes (1 MiB ≈ 4 min of Opus — far above the cap below)
# and declared length in seconds (the page itself stops at 20 s).
SPEECH_MAX_BYTES = "1048576"
SPEECH_MAX_SECONDS = "30"

# Chapter resource PDFs (src/resources.js). The bucket is PRIVATE: no
# public r2.dev URL and no custom domain — objects are only ever streamed
# by this Worker after a signed-link check. RESOURCE_RELEASE selects the
# immutable release prefix ("r1/…"); switching releases is this one line.
# Secret (wrangler secret put): RESOURCE_URL_SECRET — HMAC key for links.
RESOURCE_RELEASE = "r2"

[[r2_buckets]]
binding = "RESOURCES"
bucket_name = "klarweg-resources"

[[d1_databases]]
binding = "DB"
database_name = "klarweg-access"
database_id = "208a8507-b0ec-48e0-812c-c4aa38c8dd32"

# Private tutor Worker (tutor/worker). Deploy klarweg-tutor FIRST —
# a service binding to a Worker that does not exist fails the deploy.
[[services]]
binding = "TUTOR"
service = "klarweg-tutor"

# Secrets (wrangler secret put <NAME>) — never in this file:
#   CASHFREE_SECRET_KEY
#   RATE_SALT
#   CASHFREE_WEBHOOK_SECRET   (optional; defaults to CASHFREE_SECRET_KEY)
#   RESOURCE_URL_SECRET       (signed chapter-resource links; 32+ random bytes)
#   SPEECH_ALLOWLIST          (only for SPEECH_MODE = "allowlist": comma-separated user ids)
