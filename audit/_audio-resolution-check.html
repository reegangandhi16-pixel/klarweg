<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Klarweg · live audio resolution check</title>
<style>
:root{--canvas:#FAFAF7;--surface:#fff;--elevated:#F4F3EE;--ink:#0E0E10;--ink2:#5A5A60;--accent:#1F4E4A}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding:24px}
h1{font:600 20px/1.3 Inter,sans-serif;margin:0 0 4px}p.sub{color:var(--ink2);margin:0 0 20px;font-size:13.5px;max-width:820px}
button{font:500 13px Inter,sans-serif;padding:9px 14px;border:1px solid #E3E1DA;border-radius:8px;background:var(--surface);cursor:pointer}
button:hover{background:var(--elevated)}
#msg{color:var(--ink2);font-size:13px;margin-left:12px}
pre{background:var(--surface);border:1px solid #EDEBE4;border-radius:10px;padding:14px;font:12px/1.55 "JetBrains Mono",ui-monospace,monospace;max-height:62vh;overflow:auto;white-space:pre-wrap;margin-top:16px}
</style></head><body>
<h1>Live audio resolution check</h1>
<p class="sub">Loads the real <code>kw-audio-engine.js</code> with the real published manifests, then asks <code>KW_resolveInfo()</code> to resolve every row of the master inventory exactly as a learner's click would. Nothing is played and nothing is generated. Results land in <code>window.__KWR</code>.</p>
<div><button id="go">Run resolution check</button><button id="probe">HEAD-probe sample</button><span id="msg">idle</span></div>
<pre id="log">—</pre>
<script src="../public/audio/kw-audio-engine.js"></script>
<script src="../public/audio/kw-tts-config.js"></script>
<script>
const R = window.__KWR = { byFamily: {}, byLevel: {}, byMatch: {}, rows: 0, resolved: 0, unresolved: [], sampleUrls: [], probe: null, engine: null };
const logEl = document.getElementById('log'), msg = document.getElementById('msg');
const say = t => { msg.textContent = t; };
const show = o => { logEl.textContent = JSON.stringify(o, null, 1); };

const SHARDS = [
  { file: 'audio-inventory/story.json', family: 'story', gender: null },
  { file: 'audio-inventory/listening.json', family: 'listening', gender: null },
  { file: 'audio-inventory/reading.json', family: 'reading', gender: null },
  { file: 'audio-inventory/speaking.json', family: 'speaking', gender: null },
  { file: 'audio-inventory/grammar.json', family: 'grammar', gender: null },
  { file: 'audio-inventory/vocabulary.json', family: 'vocabulary', gender: 'byVoice' }
];

function waitForManifests() {
  // The engine loads its manifests on a deferred tick; wait until the merged
  // vocab map and the text manifest have both settled (or 20s, whichever first).
  return new Promise(resolve => {
    const t0 = Date.now();
    const poll = () => {
      const s = window.KW_audioManifestStats ? window.KW_audioManifestStats() : null;
      const ready = s && s.totalMergedWords > 0 && window.KW_audioReady && window.KW_audioReady();
      if (ready || Date.now() - t0 > 20000) return resolve(s);
      setTimeout(poll, 300);
    };
    poll();
  }).then(async s => {
    if (window.KW_ensureConjugation) {
      await window.KW_ensureConjugation();
    }
    return s;
  });
}

function tally(bucket, key) { bucket[key] = (bucket[key] || 0) + 1; }

async function run() {
  say('loading manifests…');
  const stats = await waitForManifests();
  R.engine = stats;
  for (const sh of SHARDS) {
    say('resolving ' + sh.family + '…');
    const rows = await (await fetch(sh.file, { cache: 'no-cache' })).json();
    const fam = R.byFamily[sh.family] = { total: 0, resolved: 0, byMatch: {}, bySource: {} };
    for (const row of rows) {
      const gender = sh.gender === 'byVoice' ? (row.voice === 'de-DE-Neural2-F' ? 'female' : 'male') : null;
      const info = window.KW_resolveInfo(row.text, gender);
      const ok = !!info.url;
      R.rows++; fam.total++;
      tally(R.byMatch, (info.match || 'none'));
      tally(fam.byMatch, (info.match || 'none'));
      tally(fam.bySource, info.source);
      const levels = row.levels || [];
      levels.forEach(L => {
        const b = R.byLevel[L] || (R.byLevel[L] = { total: 0, resolved: 0 });
        b.total++; if (ok) b.resolved++;
      });
      if (ok) { R.resolved++; fam.resolved++; if (R.sampleUrls.length < 4000) R.sampleUrls.push({ f: sh.family, url: info.url, text: row.text, match: info.match }); }
      else if (R.unresolved.length < 6000) R.unresolved.push({ f: sh.family, text: row.text, gender, levels });
    }
    show({ done: sh.family, family: R.byFamily[sh.family] });
  }
  // word-popup layer: headwords resolve female, paradigm forms voice-agnostic
  say('resolving word-popup layer…');
  const wl = await (await fetch('audio-scan/_wordlayer-assets.json', { cache: 'no-cache' })).json();
  for (const fam of ['clickable-word', 'word-form']) {
    const rows = wl.filter(a => a.family === fam);
    const b = R.byFamily[fam] = { total: 0, resolved: 0, byMatch: {}, bySource: {} };
    for (const row of rows) {
      const info = window.KW_resolveInfo(row.text, fam === 'clickable-word' ? 'female' : null);
      const ok = !!info.url;
      R.rows++; b.total++;
      tally(R.byMatch, info.match || 'none'); tally(b.byMatch, info.match || 'none'); tally(b.bySource, info.source);
      if (ok) { R.resolved++; b.resolved++; if (R.sampleUrls.length < 4000) R.sampleUrls.push({ f: fam, url: info.url, text: row.text, match: info.match }); }
      else if (R.unresolved.length < 6000) R.unresolved.push({ f: fam, text: row.text });
    }
    show({ done: fam, family: b });
  }
  say('DONE · ' + R.resolved + ' / ' + R.rows + ' rows resolve');
  show({ engine: R.engine, rows: R.rows, resolved: R.resolved, byFamily: R.byFamily, byMatch: R.byMatch, byLevel: R.byLevel });
}

// Confirm resolution is not a paper exercise: HEAD a stratified sample of the
// URLs the engine handed back and record the HTTP status per family.
async function probeSample() {
  const byFam = {};
  R.sampleUrls.forEach(s => { (byFam[s.f] = byFam[s.f] || []).push(s); });
  const out = {};
  for (const f of Object.keys(byFam)) {
    const list = byFam[f], step = Math.max(1, Math.floor(list.length / 40));
    const picks = []; for (let i = 0; i < list.length && picks.length < 40; i += step) picks.push(list[i]);
    const res = await Promise.all(picks.map(async p => {
      try { const r = await fetch(p.url, { method: 'HEAD', cache: 'no-cache' }); return r.status; }
      catch (e) { return 'ERR'; }
    }));
    const tal = {}; res.forEach(s => tal[s] = (tal[s] || 0) + 1);
    out[f] = { probed: picks.length, status: tal, sampleUrl: picks[0] && picks[0].url };
    say('probed ' + f);
  }
  R.probe = out;
  show({ probe: out });
}
document.getElementById('go').onclick = run;
document.getElementById('probe').onclick = probeSample;
window.__KWR_run = run; window.__KWR_probe = probeSample;
say('ready');
</script>
</body></html>
