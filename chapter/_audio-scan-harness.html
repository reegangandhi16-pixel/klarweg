<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Klarweg · audio-control runtime scan</title>
<style>
:root{--canvas:#FAFAF7;--surface:#fff;--elevated:#F4F3EE;--ink:#0E0E10;--ink2:#5A5A60;--ink3:#9A9AA0;--accent:#1F4E4A}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding:24px}
h1{font:600 20px/1.3 Inter,sans-serif;margin:0 0 4px}p.sub{color:var(--ink2);margin:0 0 24px;font-size:13.5px}
.row{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{font:500 13px Inter,sans-serif;padding:9px 14px;border:1px solid #E3E1DA;border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{background:var(--elevated)}
#bar{height:6px;background:var(--elevated);border-radius:3px;overflow:hidden;margin-bottom:12px}
#fill{height:100%;width:0;background:var(--accent)}
pre{background:var(--surface);border:1px solid #EDEBE4;border-radius:10px;padding:14px;font:12px/1.55 "JetBrains Mono",ui-monospace,monospace;max-height:46vh;overflow:auto;white-space:pre-wrap}
iframe{width:1100px;height:700px;border:1px solid #EDEBE4;border-radius:10px;background:#fff;opacity:.35}
</style></head><body>
<h1>Runtime audio-control scan</h1>
<p class="sub">Loads every chapter page, counts the audio controls the renderer actually produces, and collects the clickable-word universe. Read results with <code>window.__KWA</code>.</p>
<div class="row"><button id="go">Start scan</button><button id="stop">Stop</button><span id="msg" style="color:var(--ink2);font-size:13px">idle</span></div>
<div id="bar"><div id="fill"></div></div>
<pre id="log">—</pre>
<iframe id="fr" title="chapter under scan"></iframe>
<script src="_scan-files.js"></script>
<script>
const FILES = window.__KWA_FILES || [];
const S = window.__KWA = { pages: {}, surfaces: {}, done: [], errors: [], started: 0, popups: {} };
const fr = document.getElementById('fr'), logEl = document.getElementById('log'), fill = document.getElementById('fill'), msg = document.getElementById('msg');
let stopped = false;
const say = (t) => { msg.textContent = t; };
const put = (t) => { logEl.textContent = t + '\n' + logEl.textContent.split('\n').slice(0, 40).join('\n'); };

function load(file) {
  return new Promise((resolve) => {
    let settled = false;
    const fin = (v) => { if (!settled) { settled = true; resolve(v); } };
    fr.onload = () => {
      const d = fr.contentDocument;
      let tries = 0;
      const poll = () => {
        if (!d) return fin(null);
        const ready = d.querySelector('#sec-story, #sec-vocabulary');
        const spans = d.querySelectorAll('.rw, .de-link').length;
        if ((ready && spans) || ++tries > 40) return fin(d);
        setTimeout(poll, 100);
      };
      poll();
    };
    fr.onerror = () => fin(null);
    fr.src = file;
    setTimeout(() => fin(fr.contentDocument), 12000);
  });
}

function scanDoc(d, file) {
  const q = (sel, root) => (root || d).querySelectorAll(sel).length;
  const sec = (id) => d.querySelector('#sec-' + id);
  const inSec = (id, sel) => { const s = sec(id); return s ? s.querySelectorAll(sel).length : 0; };
  const rec = {
    file,
    controls: {
      storyLine: inSec('story', '.story-play-line'),
      storyPlayAll: inSec('story', '.story-play-all'),
      vwordF: d.querySelectorAll('#sec-vocabulary .vword-voice[data-g="female"]').length,
      vwordM: d.querySelectorAll('#sec-vocabulary .vword-voice[data-g="male"]').length,
      vwordListen: inSec('vocabulary', '.vword-btn[title="Listen"]'),
      grammarExample: inSec('grammar', '.example-line'),
      readingPassage: [...(sec('reading') ? sec('reading').querySelectorAll('button') : [])].filter(b => /listen to passage/i.test(b.textContent)).length,
      listeningPlayer: inSec('listening', '.audio-play-btn'),
      hearModel: [...(sec('speaking') ? sec('speaking').querySelectorAll('button') : [])].filter(b => /hear model/i.test(b.textContent)).length,
      exercisesAudio: inSec('exercises', '[data-audio-text], .wp-audio, .audio-play-btn'),
      quizAudio: inSec('quiz', '[data-audio-text], .wp-audio, .audio-play-btn'),
      writingAudio: inSec('writing', '[data-audio-text], .wp-audio, .audio-play-btn'),
      totalGated: q('[data-audio-text]')
    },
    spans: {}, uniqueSurfaces: 0, totalSpans: 0
  };
  ['story', 'vocabulary', 'grammar', 'reading', 'listening', 'speaking', 'writing', 'exercises', 'quiz', 'summary', 'overview', 'resources'].forEach(id => {
    const s = sec(id); if (!s) return;
    rec.spans[id] = s.querySelectorAll('.rw, .de-link').length;
  });
  const all = d.querySelectorAll('.rw, .de-link');
  rec.totalSpans = all.length;
  const seen = new Set();
  all.forEach(sp => {
    const w = (sp.textContent || '').trim();
    if (!w) return;
    seen.add(w);
    const g = S.surfaces[w] || (S.surfaces[w] = { n: 0, files: 0 });
    g.n++;
  });
  seen.forEach(w => { S.surfaces[w].files++; });
  rec.uniqueSurfaces = seen.size;
  return rec;
}

// Popup probe: click a sample of distinct surfaces and record the real audio
// controls the popup renders (headword target + every paradigm form).
function probePopups(d, file, limit) {
  const spans = [...d.querySelectorAll('.rw, .de-link')];
  const seen = new Set(); const out = [];
  for (const sp of spans) {
    if (out.length >= limit) break;
    const w = (sp.textContent || '').trim();
    if (!w || seen.has(w) || S.popups[w]) continue;
    seen.add(w);
    try { sp.click(); } catch (e) { continue; }
    const pop = d.querySelector('.word-pop.is-open');
    if (!pop) continue;
    const main = pop.querySelector('.wp-audio');
    const forms = [...pop.querySelectorAll('.wp-mini-audio')].map(b => (b.getAttribute('aria-label') || '').replace(/^Hear\s+/, ''));
    const secTitles = [...pop.querySelectorAll('.wp-section-title')].map(e => e.textContent.trim());
    const r = { w, head: main ? main.getAttribute('data-audio-text') : null, forms, sections: secTitles, file };
    S.popups[w] = r; out.push(r);
    const close = pop.querySelector('.wp-close'); if (close) close.click();
  }
  return out.length;
}

async function run() {
  stopped = false; S.started = Date.now();
  for (let i = 0; i < FILES.length; i++) {
    if (stopped) { say('stopped at ' + i); return; }
    const f = FILES[i];
    if (S.pages[f]) continue;
    const d = await load(f);
    if (!d) { S.errors.push(f); put('ERR  ' + f); continue; }
    try {
      const rec = scanDoc(d, f);
      const np = probePopups(d, f, 60);
      rec.popupsProbed = np;
      S.pages[f] = rec; S.done.push(f);
      put('ok   ' + f + '  spans ' + rec.totalSpans + '  uniq ' + rec.uniqueSurfaces + '  popups +' + np);
    } catch (e) { S.errors.push(f + ': ' + e.message); put('FAIL ' + f + ' ' + e.message); }
    fill.style.width = ((i + 1) / FILES.length * 100) + '%';
    say((i + 1) + ' / ' + FILES.length + ' · ' + Object.keys(S.surfaces).length + ' unique surfaces · ' + Object.keys(S.popups).length + ' popups');
  }
  say('DONE ' + Object.keys(S.pages).length + ' pages · ' + Object.keys(S.surfaces).length + ' surfaces · ' + Object.keys(S.popups).length + ' popups');
}
document.getElementById('go').onclick = run;
document.getElementById('stop').onclick = () => { stopped = true; };
window.__KWA_run = run;
say(FILES.length + ' pages queued');
</script>
</body></html>
