<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Klarweg · audio resolution repair audit</title>
<style>
:root{--canvas:#FAFAF7;--surface:#fff;--elevated:#F4F3EE;--ink:#0E0E10;--ink2:#5A5A60;--accent:#1F4E4A}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;padding:24px}
h1{font:600 20px/1.3 Inter,sans-serif;margin:0 0 4px}p.sub{color:var(--ink2);margin:0 0 20px;font-size:13.5px;max-width:760px}
button{font:500 13px Inter,sans-serif;padding:9px 14px;border:1px solid #E3E1DA;border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{background:var(--elevated)}
#msg{color:var(--ink2);font-size:13px;margin-left:12px}
pre{background:var(--surface);border:1px solid #EDEBE4;border-radius:10px;padding:14px;font:12px/1.55 "JetBrains Mono",ui-monospace,monospace;max-height:60vh;overflow:auto;white-space:pre-wrap}
</style></head><body>
<h1>Audio resolution repair audit</h1>
<p class="sub">Loads the real production engine (<code>kw-audio-engine.js</code> + <code>kw-tts-config.js</code>), waits for every manifest, then puts each required audio target through <code>KW_resolveInfo()</code> — the same lookup the play buttons use. Results in <code>window.__KWR</code>.</p>
<div><button id="go">Run audit</button><span id="msg">idle</span></div>
<pre id="out">—</pre>
<script src="../public/audio/kw-audio-engine.js"></script>
<script src="../public/audio/kw-tts-config.js"></script>
<script>
const msg = document.getElementById('msg'), out = document.getElementById('out');
const say = t => { msg.textContent = t; };
const J = async p => (await fetch(p, {cache:'no-cache'})).json();

async function run() {
  say('loading manifests…');
  await window.KW_ensureVocab();
  await new Promise(r => setTimeout(r, 1200));          // let the text manifest settle
  const stats = window.KW_audioManifestStats();

  say('loading required inventory…');
  const fams = ['story','listening','reading','speaking','grammar','vocabulary'];
  const req = {};
  for (const f of fams) req[f] = await J('../audit/audio-inventory/' + f + '.json');
  req.word = await J('../audit/audio-scan/_wordlayer-assets.json');

  say('loading authored generation manifests…');
  const gen = {
    story: await J('../audio-manifests/story-dialogue-manifest.json'),
    listening: await J('../audio-manifests/listening-dialogue-manifest.json'),
    reading: await J('../audio-manifests/reading-manifest.json'),
    speaking: await J('../audio-manifests/speaking-manifest.json'),
    vocabulary: await J('../audio-manifests/vocabulary-manifest.json')
  };

  const canon = window.KW_canonKey, split = window.KW_splitSentences;

  // Canonical index of every AUTHORED generation row (text we would render),
  // collision-guarded the same way the engine's is.
  const authored = {};
  const authoredSent = {};
  const addAuth = (idx, text, row) => {
    const k = canon(text); if (!k) return;
    if (idx[k] === undefined) idx[k] = row; else if (idx[k] && idx[k].de !== row.de) idx[k] = null;
  };
  for (const f of ['story','listening','reading','speaking']) {
    for (const r of gen[f]) {
      addAuth(authored, r.de, r);
      const parts = split(r.de);
      if (parts.length === 1) addAuth(authoredSent, parts[0], r);
    }
  }
  const authVocab = {};
  for (const r of gen.vocabulary) { const k = canon(r.text); if (k && authVocab[k] === undefined) authVocab[k] = r; }

  // ---- resolve every required target through the live engine ------------
  const R = { byFamily: {}, categories: {A:0,B:0,C:0,D:0,E:0}, samples: {}, matchKinds: {}, urls: [] };
  const bump = (o,k) => { o[k] = (o[k]||0) + 1; };

  const classify = (fam, a) => {
    const gender = fam === 'vocabulary' ? (a.voice === 'de-DE-Neural2-F' ? 'female' : 'male') : null;
    const info = window.KW_resolveInfo(a.text, gender);
    const res = { fam, text: a.text, source: info.source, match: info.match, url: info.url };
    if (info.source !== 'none') {
      // Served today. "correctly resolving before the repair" = exact/case hit
      // on the primary vocab CDN or the text manifest; anything reached through
      // the newly added manifests or the canonical layer is a REPAIR recovery.
      const viaNewManifest = info.manifest && info.manifest !== 'vocab-cdn';
      const viaNewLayer = info.match === 'canonical' || info.match === 'sentence-of-line';
      res.cat = (viaNewManifest || viaNewLayer) ? 'B' : 'A';
    } else {
      // Not served. Is there an authored row we can render it from?
      const k = canon(a.text);
      const auth = fam === 'vocabulary' ? authVocab[k] : (authored[k] !== undefined ? authored[k] : authoredSent[k]);
      if (auth === null) { res.cat = 'D'; res.why = 'canonical collision among authored rows — ambiguous, needs human review'; }
      else if (auth) { res.cat = 'C'; res.why = 'authored row exists; render its punctuated text'; res.renderText = auth.de || auth.text; res.speaker = auth.speaker || null; res.voice = auth.voice || null; }
      else if (fam === 'listening') {
        // sentence inside a multi-sentence authored line → cannot be answered
        // by that line's single file; genuinely missing, safe to render fresh
        res.cat = 'C'; res.why = 'transcript sentence with no single-sentence authored row — render the sentence itself';
      }
      else if (fam === 'word' && a.inDictionary === false && /^(numeral|single-letter|spelled-out|phoneme-or-interjection|syllable-split)$/.test(a.surfaceClass || '')) {
        res.cat = 'D'; res.why = 'clickable span that is not a spoken German word (' + a.surfaceClass + ') — decide whether it should be clickable at all before rendering';
      }
      else { res.cat = 'C'; res.why = 'text is in the chapter data; render under the v3 policy'; }
    }
    return res;
  };

  const allFams = fams.concat(['word']);
  for (const fam of allFams) {
    const list = req[fam];
    const f = R.byFamily[fam] = { required: list.length, A:0,B:0,C:0,D:0, served:0, matches:{}, sources:{} };
    for (let i = 0; i < list.length; i++) {
      const r = classify(fam, list[i]);
      f[r.cat]++; R.categories[r.cat]++;
      if (r.source !== 'none') { f.served++; bump(f.matches, r.match); bump(f.sources, r.source); bump(R.matchKinds, r.match); }
      if (!R.samples[fam + ':' + r.cat]) R.samples[fam + ':' + r.cat] = r;
      if (r.url && R.urls.length < 40) R.urls.push({fam, url: r.url, match: r.match});
      if (i % 4000 === 0) { say(fam + ' ' + i + '/' + list.length); await new Promise(rr => setTimeout(rr, 0)); }
    }
  }

  // ---- probe the resolved URLs for real (HEAD) --------------------------
  say('probing resolved URLs…');
  const probes = [];
  for (const u of R.urls.slice(0, 24)) {
    try { const r = await fetch(u.url, {method:'HEAD'}); probes.push({fam:u.fam, match:u.match, status:r.status, url:u.url}); }
    catch (e) { probes.push({fam:u.fam, match:u.match, status:'ERR', url:u.url}); }
  }
  R.probes = probes;
  R.manifestStats = stats;
  R.probeFailures = probes.filter(p => p.status !== 200).length;

  R.wordClassBreakdown = {};
  for (const a of req.word) if (a.inDictionary === false) bump(R.wordClassBreakdown, a.surfaceClass || 'none');
  window.__KWR = R;
  out.textContent = JSON.stringify({categories:R.categories, byFamily:R.byFamily, matchKinds:R.matchKinds, probeFailures:R.probeFailures}, null, 1);
  say('DONE');
}
document.getElementById('go').onclick = run;
window.__KWR_run = run;
</script>
</body></html>
