<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Klarweg · P20 targeted CSS collision probe</title>
<style>
body{margin:0;background:#FAFAF7;color:#0E0E10;font:14px/1.5 Inter,system-ui,sans-serif;padding:28px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#5A5A60;font-size:13px;margin-bottom:18px;max-width:760px}
.st{font-family:'JetBrains Mono',monospace;font-size:12px;color:#5A5A60;margin-bottom:12px}
pre{background:#fff;border:1px solid #EDEBE4;border-radius:10px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;white-space:pre-wrap;max-height:60vh;overflow:auto}
iframe{position:absolute;width:1200px;height:900px;left:-9999px;top:0;border:0}
</style></head><body>
<h1>P20 — targeted collision probe (6 chapters)</h1>
<div class="sub">Renders only the six chapters carrying an unproven <code>.r-*</code> colour collision, using the same render-stability gate as the P14/P15 drivers. Reads computed colours off the real DOM; no engine run, no baseline, no edits. <code>KWP20.run()</code>.</div>
<div class="st" id="status">idle</div>
<pre id="out">—</pre>
<iframe id="frame"></iframe>
<script>
const $=s=>document.querySelector(s);
const CASES=[
 {file:'chapter-b2-34-temporalsaetze-waehrend-seitdem.html',role:'temporal'},
 {file:'chapter-b2-64-praepositionen-mit-genitiv.html',role:'time'},
 {file:'chapter-b2-64-praepositionen-mit-genitiv.html',role:'place'},
 {file:'chapter-b2-65-wissenschaftssprache.html',role:'genitiv'},
 {file:'chapter-c1-08-anspruchsvolle-praepositionen.html',role:'purpose'},
 {file:'chapter-c1-11-goethe-mini-2.html',role:'genitiv'}];
const CANON=['subject','verb','object','time','place','preposition','article','adjective','adverb','negation','akkusativ','dativ','genitiv','question','modalverb','auxiliary','futur','comparative','superlative','nnoun','purpose','prep-rel','plusq','temporal','brauchen','reflexiv-akk','reflexiv-dat','connector','possessive','pronoun','rhema','conjunction','name','letter'];
function ready(f,cb){
  const S=180,N=3,HARD=30000,t0=Date.now();let last=null,same=0;
  const sig=()=>{try{const d=f.contentDocument;if(!d)return null;const nodes=d.querySelectorAll('.rw, .de-link');if(!nodes.length)return null;
    const roles={};let n=0;for(let i=0;i<nodes.length;i++){const el=nodes[i];if(el.querySelector('.rw, .de-link'))continue;n++;
      const m=String(el.className).match(/\br-[a-z-]+/);const k=m?m[0]:'(none)';roles[k]=(roles[k]||0)+1;}
    if(!n)return null;return n+'|'+Object.keys(roles).sort().map(k=>k+':'+roles[k]).join(',');}catch(e){return null;}};
  const poll=()=>{if(Date.now()-t0>HARD)return cb('hard-timeout');
    let lex=false;try{lex=!!(f.contentWindow&&f.contentWindow.KW_GLOBAL_LEXICON);}catch(e){}
    if(!lex){last=null;same=0;return setTimeout(poll,S);}
    const s=sig();if(s===null){last=null;same=0;return setTimeout(poll,S);}
    if(s===last)same++;else{same=1;last=s;}
    if(same>=N)return cb('stable');setTimeout(poll,S);};
  poll();
}
function probe(file,roles){
  return new Promise(resolve=>{
    const f=$('#frame');let done=false;const fin=r=>{if(done)return;done=true;resolve(r);};
    const timer=setTimeout(()=>fin({file,error:'timeout'}),90000);
    f.onload=()=>ready(f,(state)=>{try{
      const d=f.contentDocument,w=f.contentWindow;
      const rs=getComputedStyle(d.documentElement);
      const nodes=[].slice.call(d.querySelectorAll('.rw, .de-link'))
        .filter(n=>!n.querySelector('.rw, .de-link')).filter(n=>!n.closest('.word-pop'))
        .filter(n=>!!(n.offsetParent||n.getClientRects().length));
      // what the local <style> declares
      const local=[];
      for(const sh of d.styleSheets){let rr;try{rr=sh.cssRules;}catch(e){continue;}
        if(sh.href)continue;                      // inline sheet only
        for(const r of rr){if(!r.selectorText||!r.style)continue;
          if(!/\.r-/.test(r.selectorText))continue;
          local.push({sel:r.selectorText,color:r.style.color||null,fontWeight:r.style.fontWeight||null});}}
      // every canonical role actually rendered here
      const rendered={};nodes.forEach(n=>{const m=String(n.className).match(/\br-([a-z-]+)\b/);
        if(!m)return;const role=m[1];if(CANON.indexOf(role)<0)return;
        const c=getComputedStyle(n).color;(rendered[role]=rendered[role]||{count:0,colours:{},samples:[]});
        rendered[role].count++;rendered[role].colours[c]=(rendered[role].colours[c]||0)+1;
        if(rendered[role].samples.length<4)rendered[role].samples.push({text:n.textContent.trim(),cls:n.className,colour:c,
          sec:(n.closest('[id^="sec-"]')||{}).id||'?'});});
      const expected={};CANON.forEach(r=>{const v=rs.getPropertyValue('--g-'+r).trim();if(v)expected[r]=v;});
      // does a popup open for a sample of the affected role?
      const popups={};
      roles.forEach(role=>{const hit=nodes.find(n=>new RegExp('\\br-'+role+'\\b').test(n.className));
        if(!hit){popups[role]=null;return;}
        const cl=d.querySelector('.wp-close');if(cl)cl.click();
        hit.click();const p=d.querySelector('.word-pop');
        const head=p&&p.querySelector('.word-pop-de');
        popups[role]={opened:!!p,surface:hit.textContent.trim(),spanColour:getComputedStyle(hit).color,
          headColour:head?getComputedStyle(head).color:null,
          badge:p?((p.querySelector('.wp-badge')||{}).textContent||'').trim():null};
        const c2=d.querySelector('.wp-close');if(c2)c2.click();});
      clearTimeout(timer);fin({file,readyState:state,totalNodes:nodes.length,localRoleRules:local,rendered,expected,popups});
    }catch(e){clearTimeout(timer);fin({file,error:String(e&&e.stack||e)});}});
    f.src=file+'?p20='+Date.now();
  });
}
window.KWP20={async run(){
  const byFile={};CASES.forEach(c=>(byFile[c.file]=byFile[c.file]||[]).push(c.role));
  const files=Object.keys(byFile);const res=[];
  for(let i=0;i<files.length;i++){
    $('#status').textContent='['+(i+1)+'/'+files.length+'] '+files[i];
    res.push(await probe(files[i],byFile[files[i]]));
    window.__p20=res;$('#out').textContent=JSON.stringify(res,null,1);
  }
  $('#status').textContent='done';return res;
}};
</script>
</body></html>
