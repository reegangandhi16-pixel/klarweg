<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Klarweg · P31 G-A occurrence trace</title>
<style>
body{margin:0;background:#FAFAF7;color:#0E0E10;font:14px/1.5 Inter,system-ui,sans-serif;padding:28px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#5A5A60;font-size:13px;margin-bottom:18px;max-width:820px}
.st{font-family:'JetBrains Mono',monospace;font-size:12px;color:#5A5A60;margin-bottom:12px}
pre{background:#fff;border:1px solid #EDEBE4;border-radius:10px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;white-space:pre-wrap;max-height:56vh;overflow:auto}
iframe{position:absolute;width:1200px;height:900px;left:-9999px;top:0;border:0}
</style></head><body>
<h1>P31 — G-A occurrence trace (14 findings)</h1>
<div class="sub">Faithful full pass (same node list/order/prevHead as qa-engine.js) with DOM-ancestry capture on the watched nodes, so each occurrence can be tied back to the exact data property that produced it. Read-only.<br><code>KWP31.run()</code></div>
<div class="st" id="status">idle</div>
<pre id="out">—</pre>
<iframe id="frame"></iframe>
<script>
const $=s=>document.querySelector(s);
const CH=[
 {file:'chapter-b2-15-konzessivsaetze-obgleich.html',watch:[782,790,798]},
 {file:'chapter-b2-16-konsekutivsaetze-sodass-infolgedessen.html',watch:[794,801,806]},
 {file:'chapter-c1-26-passiv-und-passiversatzformen.html',watch:[241,245,247]},
 {file:'chapter-b2-45-passiversatz-sich-lassen.html',watch:[813,818]},
 {file:'chapter-b1-17-nebensatz-damit-um-zu.html',watch:[925]},
 {file:'chapter-a1-34-schreiben.html',watch:[448]},
 {file:'chapter-a1-37-praep-dativ.html',watch:[527]}];
function ready(f,cb){
  const S=180,N=3,HARD=30000,t0=Date.now();let last=null,same=0;
  const sig=()=>{try{const d=f.contentDocument;if(!d)return null;const nodes=d.querySelectorAll('.rw, .de-link');if(!nodes.length)return null;
    const roles={};let n=0;for(let i=0;i<nodes.length;i++){const el=nodes[i];if(el.querySelector('.rw, .de-link'))continue;n++;
      const m=String(el.className).match(/\br-[a-z-]+/);const k=m?m[0]:'(none)';roles[k]=(roles[k]||0)+1;}
    if(!n)return null;return n+'|'+Object.keys(roles).sort().map(k=>k+':'+roles[k]).join(',');}catch(e){return null;}};
  const poll=()=>{if(Date.now()-t0>HARD)return cb('hard-timeout');
    let lex=false;try{lex=!!(f.contentWindow&&f.contentWindow.KW_GLOBAL_LEXICON);}catch(e){}
    if(!lex){last=null;same=0;return setTimeout(poll,S);}
    const s=sig();if(s===null){last=null;same=0;return setTimeout(poll,S);}
    if(s===last)same++;else{same=1;last=s;}
    if(same>=N)return cb('stable');setTimeout(poll,S);};
  poll();
}
function ancestry(n){
  const out=[];let e=n.parentElement,d=0;
  while(e&&d<7){out.push(e.tagName.toLowerCase()+(e.className?'.'+String(e.className).trim().replace(/\s+/g,'.'):'')+(e.id?'#'+e.id:''));e=e.parentElement;d++;}
  return out;
}
function pass(d,watch){
  const nodes=[].slice.call(d.querySelectorAll('.rw, .de-link'))
    .filter(n=>!n.querySelector('.rw, .de-link')).filter(n=>!n.closest('.word-pop'))
    .filter(n=>!!(n.offsetParent||n.getClientRects().length));
  let prevHead='';const hits=[];
  for(let i=0;i<nodes.length;i++){
    const n=nodes[i];const word=n.textContent.trim();
    const spanColour=getComputedStyle(n).color;
    n.click();
    const pop=d.querySelector('.word-pop');
    const headEl=pop?pop.querySelector('.word-pop-de'):null;
    const headText=headEl?headEl.textContent.trim():'';
    const headColour=headEl?getComputedStyle(headEl).color:null;
    if(watch.indexOf(i)>=0){
      const badges=pop?[].slice.call(pop.querySelectorAll('.wp-badge')).map(b=>b.textContent.trim()):[];
      const block=n.closest('li,p,td,th,div');
      hits.push({index:i,surface:word,className:n.className,
        isAutoLinkified:/\bde-link\b/.test(n.className),isAuthoredToken:/\brw\b/.test(n.className),
        roleClass:(String(n.className).match(/\br-[a-z0-9-]+/g)||[]),
        spanColour:spanColour,headText:headText,headColour:headColour,badges:badges,
        section:(n.closest('[id^="sec-"]')||{}).id||'?',
        ancestry:ancestry(n),
        contextText:block?block.textContent.replace(/\s+/g,' ').trim().slice(0,150):null,
        dataType:(function(){const c=n.closest('[data-type]');return c?c.getAttribute('data-type'):null;})()});
    }
    prevHead=headText;
  }
  return {totalNodes:nodes.length,hits:hits};
}
window.KWP31={async run(){
  const out=[];
  for(let i=0;i<CH.length;i++){
    $('#status').textContent='['+(i+1)+'/'+CH.length+'] '+CH[i].file.slice(8,36);
    try{
      const r=await new Promise((res,rej)=>{const f=$('#frame');const t=setTimeout(()=>rej(new Error('timeout')),120000);
        f.onload=()=>ready(f,(s)=>{clearTimeout(t);if(s!=='stable')return rej(new Error('unstable'));
          try{res(pass(f.contentDocument,CH[i].watch));}catch(e){rej(e);}});
        f.src=CH[i].file+'?p31='+Date.now()+'_'+Math.random();});
      r.file=CH[i].file;out.push(r);
    }catch(e){out.push({file:CH[i].file,error:String(e.message||e)});}
    window.__P31=out;$('#out').textContent=JSON.stringify(out.map(o=>({f:(o.file||'').slice(8,28),hits:(o.hits||[]).length,err:o.error||null})),null,1);
  }
  $('#status').textContent='done';return out.length;
}};
$('#out').textContent='ready';
</script>
</body></html>
