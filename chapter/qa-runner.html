<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Klarweg · Occurrence QA Runner</title>
<style>
:root{--canvas:#FAFAF7;--surface:#FFF;--elev:#F4F3EE;--ink:#0E0E10;--ink2:#5A5A60;--ink3:#9A9AA0;--accent:#1F4E4A;--coral:#E55A3F}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding:32px}
h1{font-size:22px;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--ink2);font-size:13px;margin-bottom:24px}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid #E3E1DA;background:var(--surface);cursor:pointer;transition:transform .15s cubic-bezier(.16,1,.3,1),box-shadow .15s}
button:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.06)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text]{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #E3E1DA;background:var(--surface);width:200px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid #EDEBE4;border-radius:10px;padding:14px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-family:'JetBrains Mono',monospace}
#prog{height:6px;background:var(--elev);border-radius:99px;overflow:hidden;margin-bottom:20px}
#prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid #EDEBE4;border-radius:10px;overflow:hidden;font-size:13px}
th{text-align:left;padding:10px 12px;background:var(--elev);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-family:'JetBrains Mono',monospace}
td{padding:9px 12px;border-top:1px solid #F0EEE7;vertical-align:top}
td.code{font-family:'JetBrains Mono',monospace;font-size:12px}
tr.high td.code{color:var(--coral)}
.muted{color:var(--ink3)}
#log{margin-top:20px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink2);max-height:160px;overflow:auto;white-space:pre-wrap}
iframe{position:absolute;width:1200px;height:900px;left:-9999px;top:0;border:0}
</style></head><body>
<h1>Occurrence QA Runner</h1>
<div class="sub">Loads every chapter, runs <code>KWQA</code> per page, aggregates machine-readable findings. Anomalies only — inspect those by hand.</div>
<div class="bar">
  <button class="primary" id="runAll">Run all chapters</button>
  <input type="text" id="filter" placeholder="filter e.g. a1-">
  <button id="runFiltered">Run filtered</button>
  <button id="download">Download JSON</button>
  <span class="muted" id="status">idle</span>
</div>
<div id="prog"><i></i></div>
<div class="stats">
  <div class="stat"><b id="s-ch">0</b><span>chapters</span></div>
  <div class="stat"><b id="s-occ">0</b><span>occurrences</span></div>
  <div class="stat"><b id="s-find">0</b><span>findings</span></div>
  <div class="stat"><b id="s-high">0</b><span>high severity</span></div>
  <div class="stat"><b id="s-clean">0</b><span>clean chapters</span></div>
</div>
<table><thead><tr><th>Code</th><th>Count</th><th>Chapters</th><th>Examples</th></tr></thead><tbody id="byCode"></tbody></table>
<div id="log"></div>
<iframe id="frame"></iframe>
<script>
const $=s=>document.querySelector(s);
// Replace the measurement iframe with a brand-new element. Reusing a frame whose
// document was torn down is exactly what produced the null-createElement crash,
// so a retry must not inherit it.
function freshFrame(){
  const old=$('#frame'); if(!old) return;
  const nf=document.createElement('iframe');
  nf.id='frame';
  old.parentNode.replaceChild(nf,old);
}
let report={startedAt:null,chapters:[],byCode:{}};
function log(m){const l=$('#log');l.textContent=(m+'\n'+l.textContent).slice(0,4000);}

function runChapter(file){
  return new Promise(resolve=>{
    const f=$('#frame');
    let done=false;
    const finish=r=>{if(done)return;done=true;resolve(r);};
    const timer=setTimeout(()=>finish({file,error:'timeout',errorKind:'hard-timeout'}),90000);
    f.onload=()=>{
      // RENDER-STATE STABILITY, not a grace period.
      //
      // Chapters render in TWO passes: an initial pass, then a re-sweep once
      // global-lexicon.js loads and the chapter vocab index is built. Measured
      // between the two, a word shows its first-pass colour — which is how a
      //2600ms delay produced a false A1-9=6, and how a 400ms post-lexicon grace
      // produced 87 phantom `wie → r-question` findings in a2-9 that do not
      // exist on the live page. Any fixed delay is load-sensitive: it holds when
      // one chapter runs alone and fails under a 259-chapter sweep.
      //
      // Instead, sample a compact signature of the rendered state and require
      // consecutive identical samples. That is load-independent by construction.
      //
      // False stability is guarded three ways: the authoritative lexicon must be
      // present first; the signature must describe a NON-EMPTY render; and
      // STABLE_SAMPLES consecutive matches are required, so a page paused
      // mid-pass cannot pass on two coincidentally equal early reads.
      const SAMPLE_MS=180, STABLE_SAMPLES=3, HARD_MS=30000;
      const signature=()=>{
        try{
          const d=f.contentDocument;
          if(!d) return null;
          const nodes=d.querySelectorAll('.rw, .de-link');
          if(!nodes.length) return null;                 // nothing rendered yet
          const roles={};
          let n=0;
          for(let i=0;i<nodes.length;i++){
            const el=nodes[i];
            if(el.querySelector('.rw, .de-link')) continue;   // leaf occurrences only
            n++;
            const m=String(el.className).match(/\br-[a-z-]+/);
            const k=m?m[0]:'(none)';
            roles[k]=(roles[k]||0)+1;
          }
          if(!n) return null;
          const badges=d.querySelectorAll('.wp-badge').length;
          const secs=d.querySelectorAll('[id^="sec-"]').length;
          return n+'|'+secs+'|'+badges+'|'+Object.keys(roles).sort().map(k=>k+':'+roles[k]).join(',');
        }catch(e){ return null; }
      };
      const ready=cb=>{
        const t0=Date.now();
        let last=null, same=0;
        const poll=()=>{
          if(Date.now()-t0>HARD_MS){ cb('hard-timeout'); return; }
          let lex=false;
          try{ lex=!!(f.contentWindow&&f.contentWindow.KW_GLOBAL_LEXICON); }catch(e){}
          if(!lex){ last=null; same=0; setTimeout(poll,SAMPLE_MS); return; }
          const sig=signature();
          if(sig===null){ last=null; same=0; setTimeout(poll,SAMPLE_MS); return; }
          if(sig===last){ same++; } else { same=1; last=sig; }
          if(same>=STABLE_SAMPLES){ cb('stable'); return; }
          setTimeout(poll,SAMPLE_MS);
        };
        poll();
      };
      ready((readyState)=>{
        try{
          const w=f.contentWindow,d=f.contentDocument;
          // INJECTION-TIME LIVENESS CHECK.
          //
          // Under a long sweep the iframe can be navigated or torn down between
          // the readiness callback and script injection, leaving contentDocument
          // null — which threw "Cannot read properties of null (reading
          // 'createElement')" and killed 4 of 259 chapters in the last run. All
          // four measure cleanly in isolation, so this is a runner lifecycle
          // fault, not a chapter defect. Detect it explicitly and report a
          // distinct code so run() can retry from a fresh iframe rather than
          // recording a permanent failure.
          if(!w||!d||!d.head){ clearTimeout(timer); finish({file,error:'injection-error: iframe document unavailable',errorKind:'injection-error',readyState:readyState}); return; }
          const s=d.createElement('script');
          s.src='qa-engine.js?v='+Date.now();
          s.onload=()=>{
            try{ const r=w.KWQA.run(); r.readyState=readyState; clearTimeout(timer); finish(r); }
            catch(e){ clearTimeout(timer); finish({file,error:String(e),errorKind:'measurement-error',readyState:readyState}); }
          };
          s.onerror=()=>{clearTimeout(timer);finish({file,error:'engine failed to load',errorKind:'injection-error',readyState:readyState});};
          d.head.appendChild(s);
        }catch(e){clearTimeout(timer);finish({file,error:String(e),errorKind:'injection-error',readyState:readyState});}
      });
    };
    f.src=file+'?qa='+Date.now();
  });
}

async function run(files){
  report={startedAt:new Date().toISOString(),chapters:[],byCode:{}};
  let occ=0,find=0,high=0,clean=0;
  for(let i=0;i<files.length;i++){
    $('#status').textContent='['+(i+1)+'/'+files.length+'] '+files[i];
    $('#prog i').style.width=((i)/files.length*100)+'%';
    // BOUNDED RETRY. A chapter counts as measured only after successful
    // injection + stability + completed measurement. Injection/timeout faults are
    // transient runner-lifecycle failures (proven: all 4 failures from the last
    // sweep measure cleanly in isolation), so retry from a FRESH iframe rather
    // than recording a permanent failure. A measurement-error is NOT retried —
    // that would indicate a real fault in the engine or page. Never convert an
    // error into a measured zero: failures keep their error field and are
    // excluded from totals below.
    const MAX_ATTEMPTS=3;
    let r=null, attempts=[];
    for(let a=1;a<=MAX_ATTEMPTS;a++){
      r=await runChapter(files[i]);
      attempts.push({attempt:a,readyState:r.readyState||null,error:r.error||null});
      if(!r.error) break;
      if(r.errorKind==='measurement-error') break;   // real fault — do not mask by retrying
      log('RETRY '+files[i]+' (attempt '+a+' — '+r.error+')');
      freshFrame();
      await new Promise(rs=>setTimeout(rs,1200));    // let the old frame release
    }
    r.file=r.file||files[i];
    r.attempts=attempts;
    report.chapters.push(r);
    if(r.error){log('ERROR '+r.file+' — '+r.error+' after '+attempts.length+' attempt(s)');continue;}
    occ+=r.occurrences||0; find+=(r.findings||[]).length;
    if(r.clean)clean++;
    (r.findings||[]).forEach(fd=>{
      if(fd.severity==='high')high++;
      const b=report.byCode[fd.code]=report.byCode[fd.code]||{count:0,chapters:new Set(),examples:[]};
      b.count++; b.chapters.add(r.file);
      if(b.examples.length<4)b.examples.push(fd.surface+(fd.detail&&fd.detail.badge?' ['+fd.detail.badge+'→'+fd.detail.role+']':''));
    });
    if((r.findings||[]).length)log(r.file+' — '+(r.findings||[]).length+' findings');
    $('#s-ch').textContent=i+1;$('#s-occ').textContent=occ;$('#s-find').textContent=find;
    $('#s-high').textContent=high;$('#s-clean').textContent=clean;
    render();
  }
  $('#prog i').style.width='100%';
  $('#status').textContent='done — '+files.length+' chapters';
  render();
  // PERSIST THE RUN. The in-memory `report` is replaced by the next run(), so a
  // completed sweep's exact finding locations were lost the moment another sweep
  // started — which is why a +10 delta in CASE_COLLISION_CAPITALISED could not be
  // diffed against its predecessor. Write a uniquely-named artifact per run so no
  // sweep can ever overwrite another. In-memory behaviour is unchanged.
  try{ await persistRun(); }catch(e){ log('PERSIST FAILED — '+e); }
}
function render(){
  const rows=Object.entries(report.byCode).sort((a,b)=>b[1].count-a[1].count).map(([code,b])=>
    '<tr class="'+(code==='NO_POPUP'||code.indexOf('CASE_')===0||code==='ROLE_CONTRADICTS_BADGE'||code==='PARADIGM_NOT_ABOUT_WORD'?'high':'')+'">'+
    '<td class="code">'+code+'</td><td>'+b.count+'</td><td>'+b.chapters.size+'</td>'+
    '<td class="muted">'+b.examples.join(' · ')+'</td></tr>').join('');
  $('#byCode').innerHTML=rows||'<tr><td colspan="4" class="muted">no findings yet</td></tr>';
}
// Serialise the completed sweep. Includes per-chapter readiness/error state and
// EVERY exact finding (chapter, section, index, surface, code, badge, role and
// whatever detail the engine attached), so a later run can be diffed occurrence
// by occurrence rather than by aggregate counts.
window.LAST_RUNS = window.LAST_RUNS || {};
async function persistRun(){
  const stamp = new Date().toISOString().replace(/[:.]/g,'-');
  const runId = 'sweep-' + stamp;
  let occ=0, find=0, clean=0;
  const chapters = report.chapters.map(c=>{
    occ += c.occurrences||0; find += (c.findings||[]).length; if(c.clean) clean++;
    return {
      file:c.file, occurrences:c.occurrences||0, checked:c.checked||0,
      readyState:c.readyState||null, error:c.error||null, errorKind:c.errorKind||null,
      attempts:c.attempts||null, clean:!!c.clean,
      findings:(c.findings||[]).map(f=>({
        code:f.code, severity:f.severity, section:f.section, index:f.index,
        surface:f.surface, detail:f.detail||null
      }))
    };
  });
  const artifact = {
    runId, generatedAt:new Date().toISOString(),
    corpus:{ chapters:report.chapters.length, occurrences:occ, findings:find, clean:clean },
    readiness:chapters.reduce((a,c)=>{const k=c.readyState||'(none)';a[k]=(a[k]||0)+1;return a;},{}),
    errors:chapters.filter(c=>c.error).map(c=>({file:c.file,error:c.error,kind:c.errorKind})),
    byCode:chapters.reduce((a,c)=>{c.findings.forEach(f=>{a[f.code]=(a[f.code]||0)+1;});return a;},{}),
    chapters
  };
  window.LAST_RUNS[runId] = artifact;          // retained in-page for immediate diffing
  window.LAST_RUN = artifact;
  const blob = new Blob([JSON.stringify(artifact)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'klarweg-qa-' + runId + '.json';   // unique name — never overwrites
  a.click();
  log('PERSISTED ' + a.download + ' — ' + artifact.corpus.chapters + ' chapters, ' +
      artifact.corpus.findings + ' findings, ' + artifact.corpus.occurrences + ' occurrences');
  return artifact;
}
let CHAPTERS=[];
fetch('qa-chapters.json').then(r=>r.json()).then(j=>{CHAPTERS=j;log('manifest: '+j.length+' chapters');});
$('#runAll').onclick=()=>run(CHAPTERS);
$('#runFiltered').onclick=()=>{const f=$('#filter').value.trim();run(CHAPTERS.filter(c=>c.includes(f)));};
$('#download').onclick=()=>{
  const out=JSON.parse(JSON.stringify(report,(k,v)=>v instanceof Set?[...v]:v));
  const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='klarweg-qa-report.json';a.click();
};
</script>
</body></html>
