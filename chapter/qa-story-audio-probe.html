<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Klarweg · Story audio probe</title>
<style>
body{margin:0;background:#FAFAF7;color:#0E0E10;font:14px/1.5 Inter,system-ui,sans-serif;padding:28px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#5A5A60;font-size:13px;margin-bottom:16px;max-width:800px}
.st{font-family:'JetBrains Mono',monospace;font-size:12px;color:#5A5A60;margin-bottom:12px}
pre{background:#fff;border:1px solid #EDEBE4;border-radius:10px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:11px;white-space:pre-wrap;max-height:58vh;overflow:auto}
iframe{position:absolute;width:1200px;height:900px;left:-9999px;top:0;border:0}
</style></head><body>
<h1>Story audio control — discovery + X-Ray interaction</h1>
<div class="sub">Discovers the real Story audio control by enumerating every element inside <code>.story-card</code> (no selector assumed), records listener registration, then checks the element's identity before / X-Ray open / X-Ray closed. Read-only.<br><code>KWSA.run()</code></div>
<div class="st" id="status">idle</div>
<pre id="out">—</pre>
<iframe id="frame"></iframe>
<script>
const $=s=>document.querySelector(s);
const CH=['chapter-a1-15-cafe.html','chapter-a2-16-goethe-mini-2.html','chapter-b1-7-praeteritum.html',
 'chapter-b2-27-perfekt-vs-praeteritum.html','chapter-c1-04-hauptsaetze-elegant-verbinden.html',
 'chapter-c2-04-nomen-verb-verbindungen.html'];
const PROBE=`<script>
window.__E=[];window.__CLICKED=new WeakSet();
window.addEventListener('error',function(e){window.__E.push(String(e.message));});
(function(){var ce=console.error;console.error=function(){window.__E.push([].slice.call(arguments).join(' ').slice(0,140));return ce.apply(console,arguments);};})();
(function(){var o=EventTarget.prototype.addEventListener;
 EventTarget.prototype.addEventListener=function(t,f,p){if(t==='click'&&this&&this.nodeType===1)window.__CLICKED.add(this);return o.call(this,t,f,p);};})();
<\/script>`;
async function boot(file){
  const html=await (await fetch(file+'?sa='+Date.now())).text();
  const base=location.href.replace(/[^/]*$/,'');
  const f=$('#frame');
  await new Promise(res=>{f.onload=()=>res();f.srcdoc=html.replace('<head>','<head><base href="'+base+'">'+PROBE);});
  await new Promise(r=>setTimeout(r,7000));
  return {w:f.contentWindow,d:f.contentDocument};
}
const idOf=el=>el.tagName.toLowerCase()+'.'+String(el.className).trim().replace(/\s+/g,'.')+
  (el.getAttribute('aria-label')?'[aria-label="'+el.getAttribute('aria-label')+'"]':'');
window.KWSA={async run(){
 const out=[];
 for(let i=0;i<CH.length;i++){
  const file=CH[i];$('#status').textContent='['+(i+1)+'/'+CH.length+'] '+file.slice(8,38);
  try{
   const {w,d}=await boot(file);
   const cards=[].slice.call(d.querySelectorAll('.story-card'));
   // enumerate EVERY descendant of story cards that looks audio-bearing, no selector assumed
   const cand={};
   cards.forEach(c=>{[].slice.call(c.querySelectorAll('*')).forEach(el=>{
     const blob=(el.className+' '+(el.getAttribute('aria-label')||'')+' '+(el.id||'')+' '+
       Object.keys(el.dataset||{}).join(' ')).toLowerCase();
     if(!/audio|speak|play|sound|tts|listen|volume/.test(blob))return;
     const k=idOf(el);(cand[k]=cand[k]||{count:0,sample:el});cand[k].count++;});});
   // also: any <audio>, and buttons whose only content is an svg/icon
   const audioTags=d.querySelectorAll('.story-card audio').length;
   const cardButtons={};
   cards.forEach(c=>[].slice.call(c.querySelectorAll('button')).forEach(b=>{
     const k=idOf(b);(cardButtons[k]=cardButtons[k]||{count:0,sample:b});cardButtons[k].count++;}));
   const keys=Object.keys(cand);
   let chosen=null;
   if(keys.length){keys.sort((a,b)=>cand[b].count-cand[a].count);chosen=cand[keys[0]].sample;}
   let detail=null;
   if(chosen){
     const card=chosen.closest('.story-card');
     const line=card&&card.querySelector('.story-line');
     const before={id:idOf(chosen),connected:!!chosen.isConnected,disabled:!!chosen.disabled,
       tabindex:chosen.getAttribute('tabindex'),cls:String(chosen.className),
       hasListener:(function(){try{return w.__CLICKED.has(chosen);}catch(e){return null;}})(),
       pointerEvents:getComputedStyle(chosen).pointerEvents,
       hitTestReachable:(function(){try{const r=chosen.getBoundingClientRect();
         const hit=d.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
         return !!hit&&(hit===chosen||chosen.contains(hit)||hit.contains(chosen));}catch(e){return null;}})()};
     // open X-Ray
     if(line)line.click();await new Promise(r=>setTimeout(r,450));
     const xrayOpen=card?card.classList.contains('is-xray-open'):null;
     const during={sameNode:chosen.isConnected,cls:String(chosen.className),
       disabled:!!chosen.disabled,pointerEvents:getComputedStyle(chosen).pointerEvents,
       hitTestReachable:(function(){try{const r=chosen.getBoundingClientRect();
         const hit=d.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
         return !!hit&&(hit===chosen||chosen.contains(hit)||hit.contains(chosen));}catch(e){return null;}})(),
       stillInsideCard:!!(card&&card.contains(chosen))};
     // click the control while X-Ray is open
     let clickResult=null;
     try{const xb=card.classList.contains('is-xray-open');chosen.click();
       await new Promise(r=>setTimeout(r,600));
       clickResult={threw:null,classChanged:String(chosen.className)!==during.cls,
         classAfter:String(chosen.className),xrayUnchangedByAudioClick:card.classList.contains('is-xray-open')===xb};
     }catch(e){clickResult={threw:String(e&&e.message||e)};}
     // close X-Ray
     if(line)line.click();await new Promise(r=>setTimeout(r,400));
     const after={sameNode:chosen.isConnected,cls:String(chosen.className),
       disabled:!!chosen.disabled,stillInsideCard:!!(card&&card.contains(chosen)),
       hasListener:(function(){try{return w.__CLICKED.has(chosen);}catch(e){return null;}})(),
       xrayClosed:card?!card.classList.contains('is-xray-open'):null};
     detail={before,xrayOpened:xrayOpen,during,clickWhileOpen:clickResult,after,
       identityPreserved:before.id===idOf(chosen)};
   }
   out.push({file:file.slice(8,40),storyCards:cards.length,
     audioCandidates:keys.map(k=>({selector:k,count:cand[k].count})),
     audioTagsInCards:audioTags,
     buttonsInsideCards:Object.keys(cardButtons).map(k=>({selector:k,count:cardButtons[k].count})),
     chosen:chosen?idOf(chosen):null,detail,errors:(w.__E||[]).slice(0,4),errorCount:(w.__E||[]).length});
  }catch(e){out.push({file:file.slice(8,40),fatal:String(e&&e.message||e)});}
  window.__SA=out;$('#out').textContent=JSON.stringify(out,null,1);
 }
 $('#status').textContent='done';return out.length;
}};
$('#out').textContent='ready';
</script>
</body></html>
