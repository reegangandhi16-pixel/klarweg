<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Klarweg · Cluster Tracer</title>
<style>
body{margin:0;background:#FAFAF7;color:#0E0E10;font:14px/1.5 Inter,system-ui,sans-serif;padding:28px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#5A5A60;font-size:13px;margin-bottom:20px}
button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid #E3E1DA;background:#fff;cursor:pointer;margin-right:8px}
button.primary{background:#1F4E4A;color:#fff;border-color:#1F4E4A}
pre{background:#fff;border:1px solid #EDEBE4;border-radius:10px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;white-space:pre-wrap;max-height:70vh;overflow:auto}
iframe{position:absolute;width:1200px;height:900px;left:-9999px;top:0;border:0}
.st{font-family:'JetBrains Mono',monospace;font-size:12px;color:#5A5A60}
</style></head><body>
<h1>Cluster Tracer</h1>
<div class="sub">Traces EXACT flagged occurrences across chapters, capturing every store that could supply <code>.type</code> or <code>.role</code>. Investigation only — writes nothing.</div>
<div><button class="primary" id="go">Trace 3 clusters</button><span class="st" id="status">idle</span></div>
<pre id="out">—</pre>
<iframe id="frame"></iframe>
<script>
const $=s=>document.querySelector(s);
// Target patterns: badgeClass → role
const TARGETS=[['noun','r-verb']];
// Sample across levels; keep the list small so each chapter is fully traced.
const CHAPTERS=[
 'chapter-a1-29-perfekt-haben.html','chapter-a2-35-goethe-mini-4.html','chapter-a2-20-was-fuer-ein.html',
 'chapter-b1-27-goethe-mini-3.html','chapter-b1-3-konjunktiv2-hoefliche-bitten.html',
 'chapter-b2-53-goethe-mini-4.html','chapter-b2-24-einerseits-andererseits.html',
 'chapter-b2-66-argumentieren-standpunkte.html','chapter-b2-09-trennbar-vs-untrennbar.html',
 'chapter-b2-60-indirekte-rede-grundlagen.html','chapter-b2-19-ohne-zu.html',
 'chapter-c1-08-anspruchsvolle-praepositionen.html','chapter-c1-09-adjektive-mit-praepositionalergaenzungen.html',
 'chapter-a2-8-komparativ-superlativ.html','chapter-c2-22-wortbildung-der-nomen.html'
];

function traceChapter(file){
  return new Promise(resolve=>{
    const f=$('#frame'); let done=false;
    const finish=r=>{if(done)return;done=true;resolve(r);};
    const timer=setTimeout(()=>finish({file,error:'timeout',traces:[]}),60000);
    f.onload=()=>setTimeout(()=>{
      try{
        const w=f.contentWindow,d=f.contentDocument;
        const s=d.createElement('script'); s.src='qa-engine.js?v='+Date.now();
        s.onload=()=>{
          try{
            const r=w.KWQA.run();
            const all=[...d.querySelectorAll('.rw,.de-link')]
              .filter(n=>!n.querySelector('.rw,.de-link')).filter(n=>!n.closest('.word-pop'))
              .filter(n=>n.offsetParent||n.getClientRects().length);
            const GL=w.KW_GLOBAL_LEXICON||{},SL=w.KW_STORY_LEX||{},INF=w.KW_INFLECTIONS||{},C=w.CHAPTER||{};
            const norm=x=>String(x||'').toLowerCase().replace(/[^a-zäöüß]/g,'');
            const vocabFor=x=>{const k=norm(x);return (C.vocab||[]).filter(v=>norm(v.de)===k)
              .map(v=>({de:v.de,pos:v.pos,type:v.type,en:v.en}));};
            const tokenFor=x=>{const out=[],seen=new Set();
              (function walk(n,dp){if(!n||dp>10||typeof n!=='object'||seen.has(n))return;seen.add(n);
                if(Array.isArray(n)){n.forEach(y=>walk(y,dp+1));return;}
                if(typeof n.w==='string'&&n.w.trim()===x)out.push({role:n.role||null,type:n.type||null,lemma:n.lemma||n.lexicalUnit||null});
                Object.keys(n).forEach(k=>walk(n[k],dp+1));})(C,0);
              return out.slice(0,4);};
            const traces=[];
            r.findings.forEach(fd=>{
              if(fd.code!=='ROLE_CONTRADICTS_BADGE')return;
              const bc=fd.detail.badgeClass, role=fd.detail.role;
              if(!TARGETS.some(t=>t[0]===bc&&t[1]===role))return;
              if(traces.filter(t=>t.pattern===bc+'→'+role).length>=3)return; // cap per pattern per chapter
              const n=all[fd.index]; if(!n)return;
              const cl=d.querySelector('.wp-close'); if(cl)cl.click();
              n.click();
              const p=d.querySelector('.word-pop');
              const h=p&&p.querySelector('.word-pop-de');
              const line=n.closest('.sentence-inline-unit,.vword-ex,.rw-line,li,p,div');
              const k=norm(fd.surface);
              traces.push({
                pattern:bc+'→'+role, file:file.replace('chapter-','').replace('.html',''),
                section:(n.closest('[id^="sec-"]')||{}).id||'?', index:fd.index, surface:fd.surface,
                container:(n.parentElement||{}).className||'',
                sentence:line?line.textContent.trim().slice(0,80):null,
                spanCls:n.className, spanColour:w.getComputedStyle(n).color,
                headColour:h?w.getComputedStyle(h).color:null,
                badge:fd.detail.badge,
                TOKEN:tokenFor(fd.surface), VOCAB:vocabFor(fd.surface),
                SLEX:SL[k]?{role:SL[k].role,type:SL[k].type}:null,
                GLEX:GL[k]?{w:GL[k].w,type:GL[k].type}:null,
                INFL:INF[k]||null,
                LEMMA_TYPE:(function(){var L=INF[k];if(!L)return null;var e=GL[norm(L)];return e?e.type:'(lemma not in GLEX)';})(),
                authored:!!(tokenFor(fd.surface).length),
                popupEN:p?((p.querySelector('.word-pop-en')||{}).textContent||'').slice(0,32):null,
                sections:p?[...p.querySelectorAll('.wp-section-title')].map(e=>e.textContent.trim()).join('|'):null,
                roleFor:w.KW_roleFor?w.KW_roleFor(fd.surface):null
              });
            });
            const cl2=d.querySelector('.wp-close'); if(cl2)cl2.click();
            clearTimeout(timer); finish({file,traces});
          }catch(e){clearTimeout(timer);finish({file,error:String(e),traces:[]});}
        };
        s.onerror=()=>{clearTimeout(timer);finish({file,error:'engine load failed',traces:[]});};
        d.head.appendChild(s);
      }catch(e){clearTimeout(timer);finish({file,error:String(e),traces:[]});}
    },2600);
    f.src=file+'?tr='+Date.now();
  });
}

$('#go').onclick=async()=>{
  const all=[];
  for(let i=0;i<CHAPTERS.length;i++){
    $('#status').textContent='['+(i+1)+'/'+CHAPTERS.length+'] '+CHAPTERS[i];
    const r=await traceChapter(CHAPTERS[i]);
    if(r.error)all.push({file:r.file,error:r.error});
    (r.traces||[]).forEach(t=>all.push(t));
  }
  $('#status').textContent='done';
  window.__traces=all;
  const byPat={};
  all.forEach(t=>{if(!t.pattern)return;(byPat[t.pattern]=byPat[t.pattern]||[]).push(t);});
  const summary=Object.entries(byPat).map(([p,list])=>({pattern:p,sampled:list.length,
    chapters:[...new Set(list.map(x=>x.file))].length}));
  $('#out').textContent=JSON.stringify({summary,traces:all},null,1);
};
</script>
</body></html>
