<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>German Tokenizer Unit Tests</title>
<style>body{font-family:monospace;padding:24px;background:#FAFAF7}h1{font-size:18px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px 10px;text-align:left;font-size:13px}.pass{color:#1F4E4A}.fail{color:#E55A3F;font-weight:bold}#summary{font-size:15px;margin:16px 0;font-weight:bold}</style>
</head>
<body>
<h1>German Tokenizer Unit Tests — germanWordRegex()</h1>
<div id="summary">Running…</div>
<table><thead><tr><th>Input</th><th>Expected tokens</th><th>Actual tokens</th><th>Result</th></tr></thead><tbody id="rows"></tbody></table>
<script src="tokenizer.js"></script>
<script>
// Each case: [input, expected array of matched tokens]. Single-word inputs
// expect one token unless the input itself contains a non-tokenizable
// character (digits are intentionally excluded from GERMAN_WORD_CHARS —
// level codes like "A1"/"B2" are not German words, so only the letter
// portion should tokenize; this is correct behavior, not a bug).
const cases = [
  ['gehen', ['gehen']],
  ['Straße', ['Straße']],
  ['größer', ['größer']],
  ['Fuß', ['Fuß']],
  ['Mädchen', ['Mädchen']],
  ['Café', ['Café']],
  ['E-Mail', ['E-Mail']],
  ['B2', ['B']],
  ['A1', ['A']],
  ['Schüler', ['Schüler']],
  ['Französisch', ['Französisch']],
  ['Österreich', ['Österreich']],
  ['weiß', ['weiß']],
  ['Fußgänger', ['Fußgänger']],
  ['T-Shirt', ['T-Shirt']],
  ['E-Mail-Adresse', ['E-Mail-Adresse']],
];
const rows = document.getElementById('rows');
let pass = 0;
cases.forEach(([input, expected]) => {
  const re = window.KW_germanWordRegex();
  const actual = input.match(re) || [];
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  if (ok) pass++;
  const tr = document.createElement('tr');
  tr.innerHTML = '<td>' + input + '</td><td>' + JSON.stringify(expected) + '</td><td>' + JSON.stringify(actual) + '</td><td class="' + (ok ? 'pass">PASS' : 'fail">FAIL') + '</td>';
  rows.appendChild(tr);
});
document.getElementById('summary').textContent = pass + ' / ' + cases.length + ' passed';
</script>
</body></html>
