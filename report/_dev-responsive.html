<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>kw-report · responsive check</title>
<style>
body{margin:0;background:#E9E7E1;font-family:'JetBrains Mono',ui-monospace,monospace;padding:20px}
.row{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
figure{margin:0;flex:none}
figcaption{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5A5A60;margin-bottom:8px}
iframe{border:1px solid rgba(14,14,16,.18);border-radius:10px;background:#FAFAF7;display:block}
pre{white-space:pre-wrap;font-size:12px;line-height:1.6;background:#0E0E10;color:#F4F3EE;padding:16px;border-radius:10px}
</style>
</head>
<body>
<div class="row">
  <figure><figcaption>375 × 700</figcaption><iframe id="f375" src="_dev-harness.html?state=open" width="375" height="700"></iframe></figure>
  <figure><figcaption>390 × 720</figcaption><iframe id="f390" src="_dev-harness.html?state=open" width="390" height="720"></iframe></figure>
  <figure><figcaption>430 × 760</figcaption><iframe id="f430" src="_dev-harness.html?state=open" width="430" height="760"></iframe></figure>
</div>
<pre id="out">measuring…</pre>
<script>
function run(){
  var lines = [], pass = 0, fail = 0;
  function ck(w, name, v){ if (v === true) { pass++; lines.push('PASS  ' + w + '  ' + name); } else { fail++; lines.push('FAIL  ' + w + '  ' + name + '  → ' + v); } }
  [375, 390, 430].forEach(function(w){
   try {
    var fr = document.getElementById('f' + w);
    var d = fr.contentDocument, win = fr.contentWindow;
    var M = win.KW_Report._internals();
    var dlg = M.dialog, r = dlg.getBoundingClientRect();
    ck(w, 'modal open', M.root.hidden === false || 'closed');
    ck(w, 'no horizontal overflow', d.documentElement.scrollWidth <= d.documentElement.clientWidth || d.documentElement.scrollWidth + '>' + d.documentElement.clientWidth);
    ck(w, 'dialog within viewport', (r.left >= -0.5 && r.right <= w + 0.5) || Math.round(r.left) + '..' + Math.round(r.right));
    ck(w, 'bottom-sheet radius applied', win.getComputedStyle(dlg).borderBottomLeftRadius === '0px' || win.getComputedStyle(dlg).borderBottomLeftRadius);
    ck(w, 'grab handle visible', win.getComputedStyle(dlg.querySelector('.kwr-grab')).display === 'block' || 'hidden');
    ck(w, 'sheet pinned to bottom', Math.abs(r.bottom - win.innerHeight) < 1.5 || Math.round(r.bottom) + ' vs ' + win.innerHeight);
    ck(w, 'actions stack full-width', Math.round(M.sendBtn.getBoundingClientRect().width) === Math.round(M.cancelBtn.getBoundingClientRect().width) || 'mismatch');
    var small = [].slice.call(dlg.querySelectorAll('button:not([hidden]), .kwr-chip')).filter(function(b){
      var bb = b.getBoundingClientRect();
      return bb.width > 0 && bb.height > 0 && bb.height < 36;
    });
    ck(w, 'no touch target under 36px', small.length === 0 || small.map(function(b){return (b.textContent||b.className).trim().slice(0,18) + '=' + Math.round(b.getBoundingClientRect().height);}).join(', '));
    var send = M.sendBtn.getBoundingClientRect();
    ck(w, 'send button >= 44px tall', send.height >= 44 || Math.round(send.height));
    var sc = M.scroll;
    ck(w, 'body scrolls, not the page', sc.scrollHeight > sc.clientHeight ? true : 'content fits (ok)');
   } catch (e) { fail++; lines.push('ERROR ' + w + '  ' + e.message); }
  });
  document.getElementById('out').textContent = pass + ' passed, ' + fail + ' failed\n\n' + lines.join('\n');
}
setTimeout(run, 1200);
window.rerun = run;
</script>
</body>
</html>
