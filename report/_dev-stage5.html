<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stage 5 · integration checks (dev)</title>
<style>
body{margin:0;background:#0E0E10;color:#F4F3EE;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;line-height:1.6;padding:20px}
h1{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9A9AA0;margin:0 0 6px}
#sum{font-size:15px;margin:0 0 14px}
pre{white-space:pre-wrap;margin:0}
.p{color:#7FBFA8}.f{color:#FF9B8A}.g{color:#9A9AA0;display:block;margin-top:12px}
iframe{position:fixed;left:-9999px;width:1200px;height:900px;border:0}
</style>
</head>
<body>
<h1>Stage 5 · learner integration</h1>
<p id="sum">running…</p>
<pre id="out"></pre>

<iframe id="ch-a2" src="../chapter/chapter-a2-1-genitiv.html"></iframe>
<iframe id="ch-a1" src="../chapter/chapter-a1-1-alphabet.html"></iframe>
<iframe id="ch-b1" src="../chapter/chapter-b1-1-infinitiv-mit-zu.html"></iframe>
<iframe id="ch-c2" src="../chapter/chapter-c2-01-zeitformen-der-verben.html"></iframe>

<script>
window.KW_REPORT_ENDPOINT = 'https://klarweg-reports.test';
</script>
<script src="kw-report.js"></script>
<script>
(async function () {
  const out = []; let pass = 0, fail = 0;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const until = async (fn, ms = 15000) => { const t0 = Date.now(); while (Date.now() - t0 < ms) { try { if (fn()) return true; } catch (e) {} await wait(200); } return false; };
  const g = n => out.push('<span class="g">── ' + n + '</span>');
  const t = (n, c, d) => { const ok = c === true; ok ? pass++ : fail++;
    out.push('<span class="' + (ok ? 'p' : 'f') + '">' + (ok ? 'PASS' : 'FAIL') + '</span>  ' + n + (ok ? '' : '  → ' + JSON.stringify(d !== undefined ? d : c))); };
  const render = () => {
    document.getElementById('sum').innerHTML = (fail === 0 ? '<span class="p">' : '<span class="f">') + pass + ' passed, ' + fail + ' failed</span>';
    document.getElementById('out').innerHTML = out.join('\n');
    window.__stage5 = { pass, fail, failures: out.filter(l => l.includes('FAIL')) };
  };
  window.addEventListener('error', e => { t('SUITE ABORTED', e.message); render(); });
  window.addEventListener('unhandledrejection', e => { t('SUITE ABORTED', String(e.reason && e.reason.message)); render(); });

  const REPORTABLE = ['story','vocabulary','grammar','reading','listening','speaking','writing','exercises','quiz'];
  const NOT_REPORTABLE = ['overview','summary','resources'];
  const refs = (await (await fetch('section-refs.json')).json()).refs;
  const refSet = new Set(refs.map(r => r.ref));

  /* ============ A + B · real chapter pages ============ */
  for (const [key, label, level] of [['ch-a2','A2 Ch1','a2'],['ch-a1','A1 Ch1','a1'],['ch-b1','B1 Ch1','b1'],['ch-c2','C2 Ch1','c2']]) {
    g(label + ' — live chapter page');
    const fr = document.getElementById(key);
    const ready = await until(() => fr.contentDocument && fr.contentDocument.querySelectorAll('#dash-sections .dash-section').length > 0, 45000);
    if (!ready) { t(label + ' chapter rendered', false, 'timeout'); continue; }
    const d = fr.contentDocument, win = fr.contentWindow;
    await until(() => d.querySelectorAll('.kw-report-trigger').length > 0, 8000);

    const sections = [...d.querySelectorAll('#dash-sections .dash-section')];
    const ids = sections.map(s => s.dataset.sec);
    t(label + ' renders its full section set', sections.length >= 11, { n: sections.length, ids });
    t(label + ' section anchors intact (#sec-…)', sections.every(s => s.id === 'sec-' + s.dataset.sec));
    t(label + ' completion toggles still render', d.querySelectorAll('.section-complete').length > 0);
    t(label + ' sticky nav still built', d.querySelectorAll('.dash-nav-item').length === sections.length);
    t(label + ' audio buttons still present', d.querySelectorAll('[class*="audio"], .say, [data-say]').length > 0 || 'none found');

    const triggers = [...d.querySelectorAll('.kw-report-trigger')];
    const trigSecs = triggers.map(b => b.dataset.kwrSection).sort();
    const expected = ids.filter(i => REPORTABLE.indexOf(i) > -1).sort();
    t(label + ' affordance on exactly the reportable sections', JSON.stringify(trigSecs) === JSON.stringify(expected), { got: trigSecs, expected });
    t(label + ' no affordance on overview/summary/resources',
      NOT_REPORTABLE.every(id => { const s = d.querySelector('#sec-' + id); return !s || !s.querySelector('.kw-report-trigger'); }));
    t(label + ' one trigger per section head', triggers.every(b => b.parentElement.classList.contains('section-head')));
    t(label + ' reporter script injected once', d.querySelectorAll('script[src*="kw-report.js"]').length === 1, d.querySelectorAll('script[src*="kw-report.js"]').length);
    t(label + ' stylesheet injected once', d.querySelectorAll('link[href*="kw-report.css"]').length === 1);
    t(label + ' SUBMIT_ENABLED is true on the page', win.KW_Report.submitEnabled === true);

    const chap = win.CHAPTER || (win.KW_Report && null);
    const ref = win.KW_Report.sectionRef({ id: (chap && chap.id) || '' }, 'vocabulary');
    t(label + ' canonical ref matches the server allowlist', !ref || refSet.has(ref), ref);
    t(label + ' ref level matches the page level', !ref || ref.indexOf('klarweg:' + level + '/') === 0, ref);

    // open the modal and confirm the context is automatic
    triggers[0].click();
    await wait(300);
    const M = win.KW_Report._internals();
    t(label + ' modal opens from the section', M.root.hidden === false);
    const ctxRef = M.ctxDetail.textContent.match(/klarweg:[a-z0-9/_-]+/);
    t(label + ' modal carries a valid canonical section ref', !!ctxRef && refSet.has(ctxRef[0]), ctxRef && ctxRef[0]);
    t(label + ' context line shows level + chapter + section', /[A-C][12]/.test(M.ctxLine.textContent) && /Kapitel/.test(M.ctxLine.textContent), M.ctxLine.textContent);
    const textInputs = [...M.dialog.querySelectorAll('input')].filter(i => i.type !== 'radio' && i.type !== 'file');
    t(label + ' no manual chapter/section input exists', textInputs.length === 0, textInputs.map(i => i.type + '#' + i.id));
    win.KW_Report.close();
    await wait(260);
  }

  /* ============ C · screenshot preparation ============ */
  g('screenshot preparation');
  function canvasFile(type, w, h, name) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    const grd = x.createLinearGradient(0, 0, w, h);
    grd.addColorStop(0, '#1F4E4A'); grd.addColorStop(1, '#FFF8EC');
    x.fillStyle = grd; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 400; i++) { x.fillStyle = 'rgba(0,0,0,' + Math.random() * .4 + ')'; x.fillRect(Math.random() * w, Math.random() * h, 12, 12); }
    return new Promise(r => c.toBlob(b => r(new File([b], name || 'shot.png', { type: type })), type, .95));
  }
  async function dims(blob) {
    const bmp = await createImageBitmap(blob);
    const o = { w: bmp.width, h: bmp.height }; bmp.close && bmp.close(); return o;
  }

  const big = await canvasFile('image/png', 3000, 1800);
  const prepped = await KW_Report.prepareScreenshot(big);
  const pd = await dims(prepped.file);
  t('oversized image is processed', prepped.processed === true);
  t('longest edge downscaled to <= 1600px', Math.max(pd.w, pd.h) <= 1600, pd);
  t('aspect ratio preserved', Math.abs((pd.w / pd.h) - (3000 / 1800)) < 0.02, pd);
  t('exported as WebP', prepped.file.type === 'image/webp', prepped.file.type);
  t('filename rewritten to .webp', /\.webp$/.test(prepped.file.name), prepped.file.name);
  t('payload <= 2 MB', prepped.file.size <= 2 * 1024 * 1024, prepped.file.size);
  t('processed payload smaller than the original', prepped.file.size < big.size, { was: big.size, now: prepped.file.size });

  const small = await canvasFile('image/jpeg', 800, 600, 'small.jpg');
  const ps = await KW_Report.prepareScreenshot(small);
  t('small image is not upscaled', (await dims(ps.file)).w === 800);

  const junk = new File([new Uint8Array([1, 2, 3, 4, 5, 6, 7, 8])], 'broken.png', { type: 'image/png' });
  const pj = await KW_Report.prepareScreenshot(junk);
  t('undecodable image falls back to the original, no throw', pj.processed === false && pj.file === junk);

  t('type validation still rejects GIF', KW_Report.validateScreenshot(new File([new Uint8Array(4)], 'a.gif', { type: 'image/gif' })).reason === 'type');
  t('size validation still rejects > 2 MB pick', KW_Report.validateScreenshot({ type: 'image/png', size: 3e6 }).reason === 'size');

  /* ============ D · submission contract + error mapping ============ */
  g('submission contract');
  let sent = null, reply = { status: 201, body: { id: 'KW-ABC234', duplicate: false } };
  const realFetch = window.fetch.bind(window);
  window.fetch = async function (input, init) {
    const url = typeof input === 'string' ? input : input.url;
    if (url.indexOf('klarweg-reports.test') === -1) return realFetch(input, init);
    sent = { url, method: init.method, body: init.body, mode: init.mode };
    if (reply.status === 0) throw new TypeError('network');
    return new Response(JSON.stringify(reply.body || {}), { status: reply.status, headers: { 'Content-Type': 'application/json', 'Retry-After': '120' } });
  };

  const ctx = KW_Report.collectContext({ id: 'a2-1-genitiv', number: 1, title: 'Genitiv: Name + s' }, { id: 'vocabulary', label: 'Vocabulary' });
  let res = await KW_Report.submit({ category: 'audio', description: 'Audio does not play on word three.', context: ctx }, null, null);
  t('posts to the configured Worker endpoint', sent.url === 'https://klarweg-reports.test/api/reports', sent.url);
  t('uses POST + cors', sent.method === 'POST' && sent.mode === 'cors');
  t('body is multipart FormData', sent.body instanceof FormData);
  t('sends section_ref', sent.body.get('section_ref') === 'klarweg:a2/a2-1-genitiv/vocabulary', sent.body.get('section_ref'));
  t('sends category', sent.body.get('category') === 'audio');
  t('sends description', /word three/.test(sent.body.get('description')));
  t('sends client metadata', (() => { const m = JSON.parse(sent.body.get('meta')); return !!m.viewport && !!m.ua_family && 'dpr' in m; })(), sent.body.get('meta'));
  t('does not send level/chapter/section as separate fields', !sent.body.get('level') && !sent.body.get('chapter') && !sent.body.get('page_path'));
  t('no screenshot field on a text-only report', !sent.body.get('screenshot'));
  t('201 resolves as ok with the report id', res.ok === true && res.id === 'KW-ABC234', res);

  reply = { status: 200, body: { id: 'KW-ABC234', duplicate: true } };
  res = await KW_Report.submit({ category: 'audio', description: 'Audio does not play on word three.', context: ctx }, null, null);
  t('200 duplicate is surfaced as ok + duplicate', res.ok === true && res.duplicate === true, res);

  res = await KW_Report.submit({ category: 'audio', description: 'x'.repeat(4000), context: ctx }, null, null);
  t('description clamped to 2000 before sending', sent.body.get('description').length === 2000, sent.body.get('description').length);

  await KW_Report.submit({ category: 'display', description: 'Layout breaks on my phone.', context: ctx }, prepped.file, 'tok-123');
  t('screenshot attached when present', !!sent.body.get('screenshot') && sent.body.get('screenshot').type === 'image/webp');
  t('turnstile token forwarded when available', sent.body.get('cf-turnstile-response') === 'tok-123');

  const cases = [[400, 'invalid_description'], [403, 'verification_failed'], [429, 'rate_limited'], [500, 'server_error'], [503, 'service_busy']];
  for (const [status, code] of cases) {
    reply = { status, body: { error: code } };
    const r = await KW_Report.submit({ category: 'audio', description: 'Something is wrong here.', context: ctx }, null, null);
    t(status + ' surfaces as a typed failure', r.ok === false && r.code === code && r.status === status, r);
  }
  t('429 carries Retry-After', (await (async () => { reply = { status: 429, body: { error: 'rate_limited' } }; return KW_Report.submit({ category: 'audio', description: 'Something is wrong here.', context: ctx }, null, null); })()).retryAfter === 120);
  reply = { status: 0 };
  const rn = await KW_Report.submit({ category: 'audio', description: 'Something is wrong here.', context: ctx }, null, null);
  t('network failure resolves (never throws)', rn.ok === false && rn.code === 'network', rn);
  reply = { status: 500, body: { error: 'server_error', detail: 'D1_ERROR near SELECT at /worker/src/reports.js:42' } };
  const r5 = await KW_Report.submit({ category: 'audio', description: 'Something is wrong here.', context: ctx }, null, null);
  t('worker internals are not surfaced to the learner', !JSON.stringify(r5).includes('D1_ERROR') && !JSON.stringify(r5).includes('.js:'), r5);
  window.fetch = realFetch;

  /* ============ D2 · Turnstile ============ */
  g('turnstile');
  const src = await (await fetch('kw-report.js')).text();
  t('site key read from config, not hardcoded', /KW_REPORT_TURNSTILE_SITE_KEY \|\| ''/.test(src));
  t('no turnstile secret anywhere in the client', !/TURNSTILE_SECRET|secret/i.test(src.replace(/PUBLIC Turnstile SITE key[^\n]*\n/gi, '').replace(/never the secret[^\n]*/gi, '')) || !/TURNSTILE_SECRET/.test(src));
  t('unconfigured environment reports turnstileConfigured=false', KW_Report.turnstileConfigured === false);
  t('unconfigured path does not load the challenge script', !document.querySelector('script[src*="challenges.cloudflare.com"]'));
  t('endpoint + keys live in report/, not chapter-app.js',
    (await (await fetch('../chapter/chapter-app.js')).text()).indexOf('workers.dev') === -1);

  /* ============ E · regression scan of chapter-app.js ============ */
  g('chapter-app.js regression scan');
  const app = await (await fetch('../chapter/chapter-app.js')).text();
  t('chapter-app.js parses', (() => { try { new Function(app); return true; } catch (e) { return e.message; } })());
  t('report hook is 3 small insertions only',
    (app.match(/kwQueueReport\(/g) || []).length === 2 && (app.match(/kwLoadReporter\(/g) || []).length === 2, {
      queue: (app.match(/kwQueueReport\(/g) || []).length, load: (app.match(/kwLoadReporter\(/g) || []).length });
  t('audio engine call sites untouched', /KW_audioPreload/.test(app) && /preloadChapterAudio/.test(app));
  t('no audio/TTS/CDN identifier introduced by the hook', !/kwReport[^\n]*(audio|tts|cdn|manifest)/i.test(app));
  t('reporter never awaited by lesson code', !/await\s+kw(Load|Queue|Flush)Report/.test(app));
  t('every reporter entry point is guarded', (app.match(/catch \(e\) \{[^\n]*\}/g) || []).length > 0 && /function kwQueueReport[\s\S]{0,220}try \{/.test(app));

  render();
})();
</script>
</body>
</html>
