<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Issue Reports · Klarweg Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- ============================ LOGIN ============================ -->
<section class="login" id="login" hidden>
  <div class="login-card">
    <p class="eyebrow">Klarweg</p>
    <h1>Issue Reports</h1>
    <p class="sub">Internal tool. Sign in to review learner reports.</p>
    <p class="msg" id="login-msg" role="alert" hidden></p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="passphrase">Passphrase</label>
        <input type="password" id="passphrase" name="passphrase" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
    </form>
  </div>
</section>

<!-- ========================== DASHBOARD ========================== -->
<div id="dashboard" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">Klarweg</span>
      <strong>Issue Reports</strong>
    </div>
    <div class="topbar-right">
      <button type="button" class="btn btn-ghost btn-sm" id="logout">Sign out</button>
    </div>
  </header>

  <main class="wrap">
    <div class="counts" id="counts"></div>

    <div class="toolbar">
      <div class="field grow">
        <label for="f-search">Search</label>
        <input type="search" id="f-search" placeholder="Report ID, description, chapter or section" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-status">Status</label>
        <select id="f-status"><option value="">All statuses</option></select>
      </div>
      <div class="field">
        <label for="f-category">Category</label>
        <select id="f-category"><option value="">All categories</option></select>
      </div>
      <div class="field">
        <label for="f-level">Level</label>
        <select id="f-level"><option value="">All levels</option></select>
      </div>
      <div class="field">
        <label for="f-chapter">Chapter</label>
        <select id="f-chapter"><option value="">All chapters</option></select>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="clear">Clear</button>
    </div>

    <div class="list" id="list" aria-live="polite"></div>

    <div class="more" id="more" hidden>
      <button type="button" class="btn btn-ghost" id="more-btn">Load more</button>
    </div>
  </main>
</div>

<!-- ======================== DETAIL DRAWER ======================== -->
<div class="drawer-host" id="drawer-host" hidden>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <div>
        <p class="eyebrow" id="drawer-kicker">Report</p>
        <h2 id="drawer-title">—</h2>
      </div>
      <button type="button" class="icon-btn" id="drawer-close" aria-label="Close report" style="margin-left:auto">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot">
      <a class="btn btn-primary" id="drawer-open" href="#" target="_blank" rel="noopener" hidden>Open affected section</a>
    </div>
  </aside>
</div>

<script src="/admin/admin-api.js"></script>
<script src="/admin/admin-app.js"></script>
</body>
</html>
