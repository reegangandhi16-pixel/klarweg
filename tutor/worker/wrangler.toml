name = "klarweg-tutor"
main = "src/index.js"
compatibility_date = "2024-11-06"

# PRIVATE WORKER. No public URL: reachable only through the
# klarweg-access service binding (binding "TUTOR" there).
workers_dev = false
preview_urls = false

# The content registry (src/registry/generated/) is built from the
# authoritative chapter files before every deploy:
[build]
command = "node ../../scripts/build-tutor-registry.mjs"

[vars]
# Provider chosen from the tutor/eval validation (2026-09-27).
# Learners reach this Worker only when klarweg-access has
# AI_ENABLED = "true"; the access kill switch stays authoritative.
# Emergency off here: LLM_PROVIDER = "none" (every request returns the
# deterministic fallback / 503).
#   none | anthropic | openai | gemini        (mock = tests only)
LLM_PROVIDER = "openai"
LLM_MODEL = "gpt-6-luna"
LLM_TIMEOUT_MS = "12000"
# Chat Completions reasoning_effort for explain_grammar ONLY (OpenAI).
# "low" measured 15/15, p95 6.1 s; the default (medium) timed out 1/15.
# Other chapter actions send no reasoning_effort (model default).
LLM_REASONING_EFFORT_EXPLAIN = "low"
# Same, for the homepage chat action only (open-ended explanations, like
# explain_grammar, so the same measured setting).
LLM_REASONING_EFFORT_CHAT = "low"
# Current list price of the selected model in USD per 1M tokens,
# used for the global daily spend limit enforced by klarweg-access.
# Set these together with LLM_MODEL, from the provider's pricing page
# (gpt-6-luna, fetched 2026-09-27 — see tutor/eval/prices.json).
PRICE_INPUT_PER_MTOK_USD = "0.10"
PRICE_OUTPUT_PER_MTOK_USD = "0.50"

# Secrets — `wrangler secret put <NAME>`; NEVER in this file or the repo.
# Only the one matching LLM_PROVIDER is needed:
#   ANTHROPIC_API_KEY
#   OPENAI_API_KEY
#   GEMINI_API_KEY
